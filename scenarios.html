<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF ECE Policy Scenarios — CPAC Priorities</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }

        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 28px 30px; }
        .header-content { max-width: 1200px; margin: 0 auto; }
        .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.9; max-width: 700px; }
        .header-pills { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .pill { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; text-align: center; min-width: 100px; }
        .pill-value { font-size: 18px; font-weight: 700; }
        .pill-label { font-size: 11px; opacity: 0.9; text-transform: uppercase; }
        .data-source { font-size: 11px; opacity: 0.7; margin-top: 12px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* ELFA Tiers */
        .elfa-tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
        .elfa-tier { background: white; border-radius: 10px; padding: 16px; text-align: center; border: 2px solid #e0e0e0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .elfa-tier.active { border-color: #4CAF50; background: #f1f8e9; }
        .elfa-tier.new { border-color: #FF9800; background: #fff8e1; }
        .elfa-tier .ami { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 4px; }
        .elfa-tier .benefit { font-size: 20px; font-weight: 700; color: #333; }
        .elfa-tier.active .benefit { color: #2e7d32; }
        .elfa-tier.new .benefit { color: #e65100; }
        .elfa-tier .note { font-size: 11px; color: #888; margin-top: 4px; }
        .elfa-tier.new .note { color: #e65100; }

        /* Scenario Cards */
        .cards-header { text-align: center; margin-bottom: 20px; }
        .cards-header h2 { font-size: 22px; color: #333; margin-bottom: 6px; }
        .cards-header p { color: #777; font-size: 14px; }
        .cards-header .cpac-badge { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }

        .scenario-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .scenario-card { background: white; border-radius: 12px; padding: 22px; cursor: pointer; transition: all 0.3s; border: 1px solid #e0e0e0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: relative; overflow: hidden; }
        .scenario-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .scenario-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .scenario-card .priority-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .scenario-card h3 { font-size: 17px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .scenario-card .tagline { font-size: 13px; font-style: italic; color: #667eea; margin-bottom: 12px; }
        .scenario-card .preview { font-size: 13px; color: #666; line-height: 1.7; }
        .scenario-card .preview .win { color: #2e7d32; }
        .scenario-card .preview .concern { color: #c62828; }
        .scenario-card .preview .question { color: #e65100; }
        .scenario-card .explore-btn { width: 100%; margin-top: 14px; padding: 10px; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 8px; color: #667eea; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .scenario-card .explore-btn:hover { background: #667eea; color: white; }

        .card-a::before { background: #e91e63; } .card-a .priority-num { color: #e91e63; }
        .card-b::before { background: #2196F3; } .card-b .priority-num { color: #2196F3; }
        .card-c::before { background: #FF9800; } .card-c .priority-num { color: #FF9800; }
        .card-d::before { background: #9C27B0; } .card-d .priority-num { color: #9C27B0; }
        .card-e::before { background: #009688; } .card-e .priority-num { color: #009688; }

        /* Detail View */
        .back-btn { background: #f5f5f5; border: 1px solid #e0e0e0; color: #555; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .back-btn:hover { background: #e8e8e8; }
        .detail-header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; border-left: 5px solid #667eea; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .detail-header h1 { font-size: 24px; color: #333; margin-bottom: 6px; }
        .detail-header .tagline { font-size: 15px; color: #667eea; font-style: italic; }

        /* Content Sections */
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } .elfa-tiers { grid-template-columns: repeat(2, 1fr); } }
        .content-section { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .content-section.full-width { grid-column: 1 / -1; }
        .section-header { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }

        /* Flow Diagram */
        .flow-diagram { display: flex; flex-direction: column; gap: 12px; }
        .flow-step { background: #fafafa; padding: 14px 16px; border-radius: 8px; border-left: 4px solid #667eea; }
        .flow-step.positive { border-left-color: #4CAF50; }
        .flow-step.negative { border-left-color: #f44336; }
        .flow-step.warning { border-left-color: #FF9800; }
        .flow-step.question { border-left-color: #2196F3; }
        .flow-step strong { display: block; font-size: 14px; color: #333; margin-bottom: 4px; }
        .flow-step span { font-size: 13px; color: #666; }

        /* Impact Categories */
        .impact-category { margin: 16px 0; }
        .impact-category h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .impact-category.benefits h4 { color: #2e7d32; }
        .impact-category.concerns h4 { color: #c62828; }
        .impact-category.unknowns h4 { color: #e65100; }
        .impact-category ul { list-style: none; padding: 0; }
        .impact-category li { padding: 5px 0 5px 22px; position: relative; font-size: 13px; color: #555; }
        .impact-category.benefits li::before { content: '\2713'; position: absolute; left: 0; color: #4CAF50; font-weight: bold; }
        .impact-category.concerns li::before { content: '\2717'; position: absolute; left: 0; color: #f44336; font-weight: bold; }
        .impact-category.unknowns li::before { content: '?'; position: absolute; left: 0; color: #FF9800; font-weight: bold; }

        /* Stats Box */
        .stats-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 16px 0; }
        .stat-item { background: #fafafa; padding: 14px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
        .stat-value { font-size: 22px; font-weight: 700; color: #333; }
        .stat-value.positive { color: #2e7d32; }
        .stat-value.negative { color: #c62828; }
        .stat-value.highlight { color: #667eea; }
        .stat-label { font-size: 11px; color: #888; margin-top: 4px; }

        /* Quote Box */
        .quote-box { background: #f5f0ff; border: 1px solid #e0d4f5; border-radius: 10px; padding: 16px; margin: 16px 0; }
        .quote-box h4 { color: #667eea; font-size: 13px; margin-bottom: 10px; }
        .quote { font-style: italic; background: white; padding: 12px; border-left: 3px solid #667eea; margin: 8px 0; font-size: 13px; color: #555; line-height: 1.6; border-radius: 0 6px 6px 0; }
        .quote strong { font-style: normal; color: #333; }

        /* Callout Box */
        .callout { border-radius: 8px; padding: 16px; margin: 16px 0; font-size: 13px; line-height: 1.6; }
        .callout.info { background: #e8f0fe; border-left: 4px solid #4285f4; }
        .callout.warning { background: #fff3e0; border-left: 4px solid #FF9800; }
        .callout.success { background: #e8f5e9; border-left: 4px solid #4CAF50; }
        .callout h4 { font-size: 14px; margin-bottom: 6px; }
        .callout.info h4 { color: #1565c0; }
        .callout.warning h4 { color: #e65100; }
        .callout.success h4 { color: #2e7d32; }
        .callout p { color: #555; margin-bottom: 4px; }

        /* Toggle */
        .toggle-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .toggle-btn { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .toggle-btn:hover { background: #e0e0e0; }
        .toggle-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }

        /* Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
        .data-table th { background: #f0f0f0; padding: 10px 12px; text-align: right; font-weight: 600; color: #555; border-bottom: 2px solid #ddd; }
        .data-table th:first-child { text-align: left; }
        .data-table td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #eee; }
        .data-table td:first-child { text-align: left; font-weight: 600; }
        .data-table tr:hover { background: #f9f9ff; }
        .data-table tfoot td { font-weight: 700; border-top: 2px solid #ddd; background: #fafafa; }
        .data-table .high { color: #c62828; font-weight: 700; }
        .data-table .low { color: #2e7d32; font-weight: 700; }

        /* Chart */
        .chart-wrap { margin: 16px 0; }
        .chart-wrap canvas { max-height: 350px; }
        .chart-subtitle { font-size: 12px; color: #888; font-style: italic; margin-bottom: 8px; }

        /* Advocacy */
        .advocacy-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
        .action-btn { background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .action-btn:hover { background: #c8e6c9; transform: translateY(-2px); }

        /* Comparison Table */
        .comparison-table { border-radius: 8px; overflow: hidden; margin: 16px 0; border: 1px solid #e0e0e0; }
        .comparison-table table { width: 100%; border-collapse: collapse; }
        .comparison-table th { background: #f0f0f0; color: #555; padding: 12px; text-align: left; font-size: 13px; font-weight: 600; }
        .comparison-table td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; color: #555; }
        .comparison-table tr:last-child td { border-bottom: none; }

        /* Footer */
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; margin-top: 20px; }
        .footer a { color: #667eea; text-decoration: none; }

        /* Loading */
        .loading { display: flex; justify-content: center; align-items: center; height: 60vh; flex-direction: column; gap: 16px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        window.CHILDCARE_DATA = null;
        fetch('https://ece-data-host.vercel.app/childcare_all_coordinates.json')
            .then(r => r.json())
            .then(d => {
                window.CHILDCARE_DATA = d;
                if (window.onDataLoad) window.onDataLoad();
            })
            .catch(e => {
                console.error('Data load failed:', e);
                document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#c62828;">Error loading data. Run a local server: <code>python -m http.server 8000</code></div>';
            });

        // Source: ACS 2020-2024 5-year, MOHCD 2025 AMI thresholds, DataSF Districts
        const DEMAND_DATA = [
            { district: 1,  total_hh: 2301, le110: 1055, b110_150: 278, b150_200: 239, gt200:  730, under3: 1902, age3_4: 1143, age5: 412 },
            { district: 2,  total_hh: 2186, le110:  838, b110_150: 245, b150_200: 249, gt200:  854, under3: 2078, age3_4: 1303, age5: 393 },
            { district: 3,  total_hh: 1281, le110:  741, b110_150: 122, b150_200: 102, gt200:  316, under3: 1012, age3_4: 818,  age5: 219 },
            { district: 4,  total_hh: 2314, le110: 1077, b110_150: 300, b150_200: 242, gt200:  693, under3: 1844, age3_4: 1122, age5: 678 },
            { district: 5,  total_hh: 1699, le110:  836, b110_150: 178, b150_200: 154, gt200:  531, under3: 1558, age3_4: 742,  age5: 343 },
            { district: 6,  total_hh: 2332, le110:  977, b110_150: 236, b150_200: 234, gt200:  886, under3: 1987, age3_4: 1275, age5: 312 },
            { district: 7,  total_hh: 2810, le110: 1206, b110_150: 312, b150_200: 306, gt200:  986, under3: 2327, age3_4: 1226, age5: 632 },
            { district: 8,  total_hh: 2873, le110: 1101, b110_150: 301, b150_200: 315, gt200: 1155, under3: 2317, age3_4: 1235, age5: 506 },
            { district: 9,  total_hh: 2285, le110: 1064, b110_150: 264, b150_200: 232, gt200:  726, under3: 2076, age3_4: 1136, age5: 568 },
            { district: 10, total_hh: 2205, le110: 1267, b110_150: 222, b150_200: 179, gt200:  536, under3: 2122, age3_4: 1206, age5: 626 },
            { district: 11, total_hh: 2384, le110: 1255, b110_150: 295, b150_200: 232, gt200:  601, under3: 2527, age3_4: 1166, age5: 912 }
        ];

        const CORRIDORS = {
            'Westside': [1, 4, 7],
            'North/Central': [2, 3, 5, 6],
            'South Central': [8, 9],
            'Southeast': [10, 11]
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const App = () => {
            const [data, setData] = useState([]);
            const [activeScenario, setActiveScenario] = useState(null);

            useEffect(() => {
                if (window.CHILDCARE_DATA) setData(window.CHILDCARE_DATA);
                else window.onDataLoad = () => setData(window.CHILDCARE_DATA);
            }, []);

            // Supply computation (same as landscape.html)
            const supplyByDistrict = useMemo(() => {
                const licensed = data.filter(f => f.facility_status === 'LICENSED');
                const result = {};
                for (let i = 1; i <= 11; i++) {
                    const distStr = String(i);
                    const inDist = licensed.filter(f => f.supervisor_district === distStr);
                    const fccTypes = ['SMALL FAMILY CHILD CARE HOME', 'LARGE FAMILY CHILD CARE HOME'];
                    result[i] = {
                        totalCap: inDist.reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        elfaCap: inDist.filter(f => f.elfa_contracted === 'Yes').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        elfaCount: inDist.filter(f => f.elfa_contracted === 'Yes').length,
                        infantCap: inDist.filter(f => f.facility_type === 'INFANT CENTER').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        fccCount: inDist.filter(f => fccTypes.includes(f.facility_type)).length,
                        fccCap: inDist.filter(f => fccTypes.includes(f.facility_type)).reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        count: inDist.length
                    };
                }
                result.total = {
                    totalCap: licensed.reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    elfaCap: licensed.filter(f => f.elfa_contracted === 'Yes').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    elfaCount: licensed.filter(f => f.elfa_contracted === 'Yes').length,
                    infantCap: licensed.filter(f => f.facility_type === 'INFANT CENTER').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    fccCount: licensed.filter(f => ['SMALL FAMILY CHILD CARE HOME', 'LARGE FAMILY CHILD CARE HOME'].includes(f.facility_type)).length,
                    fccCap: licensed.filter(f => ['SMALL FAMILY CHILD CARE HOME', 'LARGE FAMILY CHILD CARE HOME'].includes(f.facility_type)).reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    count: licensed.length
                };
                return result;
            }, [data]);

            const demandTotals = useMemo(() => {
                const t = { total_hh: 0, le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0 };
                DEMAND_DATA.forEach(d => { Object.keys(t).forEach(k => { t[k] += d[k]; }); });
                t.under6 = t.under3 + t.age3_4 + t.age5;
                return t;
            }, []);

            const corridorData = useMemo(() => {
                return Object.entries(CORRIDORS).map(([name, dists]) => {
                    const supply = {
                        totalCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.totalCap || 0), 0),
                        elfaCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.elfaCap || 0), 0),
                        fccCount: dists.reduce((s, d) => s + (supplyByDistrict[d]?.fccCount || 0), 0),
                        count: dists.reduce((s, d) => s + (supplyByDistrict[d]?.count || 0), 0),
                    };
                    const demand = { le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0, total_hh: 0 };
                    DEMAND_DATA.filter(d => dists.includes(d.district)).forEach(d => {
                        Object.keys(demand).forEach(k => { demand[k] += d[k]; });
                    });
                    demand.under6 = demand.under3 + demand.age3_4 + demand.age5;
                    return { name, dists, supply, demand };
                });
            }, [supplyByDistrict]);

            if (!data.length) {
                return React.createElement('div', { className: 'loading' },
                    React.createElement('div', { className: 'spinner' }),
                    React.createElement('div', null, 'Loading facility data...')
                );
            }

            const le200Total = demandTotals.le110 + demandTotals.b110_150 + demandTotals.b150_200;
            const totalCap = Math.round(supplyByDistrict.total?.totalCap || 0);
            const elfaCap = Math.round(supplyByDistrict.total?.elfaCap || 0);
            const elfaCount = supplyByDistrict.total?.elfaCount || 0;
            const fccCount = supplyByDistrict.total?.fccCount || 0;

            return React.createElement('div', null,
                // Header
                React.createElement('div', { className: 'header' },
                    React.createElement('div', { className: 'header-content' },
                        React.createElement('h1', null, 'SF ECE Policy Scenarios'),
                        React.createElement('p', null, 'Aligned with CPAC policy priorities. Powered by live facility data.'),
                        React.createElement('div', { className: 'header-pills' },
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, totalCap.toLocaleString()),
                                React.createElement('div', { className: 'pill-label' }, 'Licensed Capacity')
                            ),
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, elfaCount.toLocaleString()),
                                React.createElement('div', { className: 'pill-label' }, 'ELFA Sites')
                            ),
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, elfaCap.toLocaleString()),
                                React.createElement('div', { className: 'pill-label' }, 'ELFA Capacity')
                            ),
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, '1,150'),
                                React.createElement('div', { className: 'pill-label' }, 'Waitlist (Mar 2026)')
                            ),
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, fccCount.toLocaleString()),
                                React.createElement('div', { className: 'pill-label' }, 'Licensed FCCs')
                            ),
                            React.createElement('div', { className: 'pill' },
                                React.createElement('div', { className: 'pill-value' }, le200Total.toLocaleString()),
                                React.createElement('div', { className: 'pill-label' }, 'HH \u2264200% AMI')
                            )
                        ),
                        React.createElement('div', { className: 'data-source' }, 'Data: CDSS Facility Database \u2022 ACS 2020-2024 \u2022 MOHCD 2025 AMI \u2022 DEC \u2022 Updated Mar 2026')
                    )
                ),
                // Main
                React.createElement('div', { className: 'container' },
                    // ELFA Tiers
                    React.createElement('div', { className: 'elfa-tiers' },
                        React.createElement('div', { className: 'elfa-tier active' },
                            React.createElement('div', { className: 'ami' }, '\u2264110% AMI'),
                            React.createElement('div', { className: 'benefit' }, 'FREE'),
                            React.createElement('div', { className: 'note' }, 'Full tuition credit')
                        ),
                        React.createElement('div', { className: 'elfa-tier active' },
                            React.createElement('div', { className: 'ami' }, '111-150% AMI'),
                            React.createElement('div', { className: 'benefit' }, '100% Credit'),
                            React.createElement('div', { className: 'note' }, 'Full tuition credit')
                        ),
                        React.createElement('div', { className: 'elfa-tier new' },
                            React.createElement('div', { className: 'ami' }, '151-200% AMI'),
                            React.createElement('div', { className: 'benefit' }, '50% Credit'),
                            React.createElement('div', { className: 'note' }, 'Effective 7/1/2026')
                        ),
                        React.createElement('div', { className: 'elfa-tier' },
