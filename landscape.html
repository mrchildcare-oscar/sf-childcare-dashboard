                                            return 'Total ELFA-eligible HH: ' + (z.le110 + z.b110_150 + z.b150_200).toLocaleString();
                                        }
                                        return '';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: { beginAtZero: true, stacked: true, ticks: { callback: v => v.toLocaleString() } },
                            x: { stacked: true }
                        }
                    }
                });
            }, [data, supplyByZip, tab, geoView]);

            // Invalidate map sizes when switching tabs/views
            useEffect(() => {
                setTimeout(() => {
                    if (tab === 'programs' && mapInst.current) {
                        mapInst.current.invalidateSize();
                    }
                    if (tab === 'landscape' && geoView === 'citywide' && districtMapInst.current) {
                        districtMapInst.current.invalidateSize();
                        districtMapInst.current.setView([37.7600, -122.4400], 12);
                    }
                }, 50);
            }, [tab, geoView]);

            const toggle = (arr, set, val) => {
                set(arr.includes(val) ? arr.filter(v => v !== val) : [...arr, val]);
            };

            const clearAllFilters = () => {
                setSearch('');
                setTypeF([]);
                setStatusF([]);
                setElfaF([]);
                setDistrictF([]);
                setMinCap('');
                setMaxCap('');
                setSfusdOnly(false);
                setPrekOnly(false);
                setTkOnly(false);
                setHeadStartOnly(false);
                setCsppOnly(false);
                setCctrOnly(false);
            };

            const activeFilterCount = typeF.length + statusF.length + elfaF.length + districtF.length +
                                     (minCap ? 1 : 0) + (maxCap ? 1 : 0) + (sfusdOnly ? 1 : 0) + (prekOnly ? 1 : 0) + (tkOnly ? 1 : 0) + (headStartOnly ? 1 : 0) + (csppOnly ? 1 : 0) + (cctrOnly ? 1 : 0) + (search ? 1 : 0);

            // Helper for AMI bar rendering
            const AMI_COLORS = {
                le110: '#1B6B4A',
                b110_150: '#2D8F64',
                b150_200: '#E07B3C',
                gt200: '#D9D5CE'
            };

            if (!data.length) return <div className="loading"><div className="spinner"></div><div>Loading data...</div></div>;

            return <div>
                <div className="header">
                        <div className="header-content">
                            <div>
                                <h1>SF Child Care Dashboard</h1>
                                <p>Licensed Centers & Large FCCs - All facilities mapped (some with approximate ZIP-based locations)</p>
                            </div>
                            <div className="header-stats">
                                {tab === 'programs' ? <>
                                    <div className="stat-pill"><div className="stat-value">{stats.total.toLocaleString()}</div><div className="stat-label">Facilities</div></div>
                                    <div className="stat-pill"><div className="stat-value">{stats.cap.toLocaleString()}</div><div className="stat-label">Capacity</div></div>
                                    <div className="stat-pill"><div className="stat-value">{stats.licPct}%</div><div className="stat-label">Licensed</div></div>
                                    <div className="stat-pill"><div className="stat-value">{stats.sfu}</div><div className="stat-label">SFUSD</div></div>
                                </> : <>
                                    <div className="stat-pill"><div className="stat-value">{supplyByDistrict.total?.totalCap?.toLocaleString() || '...'}</div><div className="stat-label">Licensed Slots</div></div>
                                    <div className="stat-pill"><div className="stat-value">{supplyByDistrict.total?.elfaCap?.toLocaleString() || '...'}</div><div className="stat-label">ELFA Slots</div></div>
                                    <div className="stat-pill"><div className="stat-value">{supplyByDistrict.total?.totalCap && demandTotals.under6 ? (supplyByDistrict.total.totalCap / demandTotals.under6).toFixed(2) : '...'}</div><div className="stat-label">Slots/Child</div></div>
                                    <div className="stat-pill"><div className="stat-value">{demandTotals.under6?.toLocaleString()}</div><div className="stat-label">All Children &lt;6</div></div>
                                </>}
                                <div className="help-icon" onClick={() => setModal(true)}>?</div>
                            </div>
                        </div>
                </div>

                <div className="tab-bar">
                    <button className={`tab-btn ${tab === 'landscape' ? 'active' : ''}`} onClick={() => setTab('landscape')}>Supply &amp; Demand</button>
                    <button className={`tab-btn ${tab === 'programs' ? 'active' : ''}`} onClick={() => setTab('programs')}>Programs &amp; Sites</button>

                </div>

                <div className="container">

                <div style={{display: tab === 'programs' ? 'block' : 'none'}}>
                    <div className="grid">
                        <div className="card sidebar">
                            <div className="sidebar-header">
                                <h2>Filters</h2>
                                <input className="search-box" placeholder="Search by name, address, license #, ZIP..." value={search} onChange={e => setSearch(e.target.value)} />
                            </div>

                            {activeFilterCount > 0 && (
                                <div className="active-filters">
                                    <div className="active-filters-header">Active Filters ({activeFilterCount})</div>
                                    <div className="filter-chips">
                                        {search && <div className="filter-chip">Search: "{search}" <span className="filter-chip-close" onClick={() => setSearch('')}>×</span></div>}
                                        {typeF.map(t => <div key={t} className="filter-chip">{t} <span className="filter-chip-close" onClick={() => toggle(typeF, setTypeF, t)}>×</span></div>)}
                                        {statusF.map(s => <div key={s} className="filter-chip">{s} <span className="filter-chip-close" onClick={() => toggle(statusF, setStatusF, s)}>×</span></div>)}
                                        {elfaF.map(e => <div key={e} className="filter-chip">ELFA: {e} <span className="filter-chip-close" onClick={() => toggle(elfaF, setElfaF, e)}>×</span></div>)}
                                        {districtF.map(d => {
                                            if (d === 'none') {
                                                return <div key={d} className="filter-chip">No District Info <span className="filter-chip-close" onClick={() => toggle(districtF, setDistrictF, d)}>×</span></div>;
                                            }
                                            const dist = districts.find(x => x.number === d);
                                            return <div key={d} className="filter-chip">District {d} - {dist?.name} <span className="filter-chip-close" onClick={() => toggle(districtF, setDistrictF, d)}>×</span></div>;
                                        })}
                                        {minCap && <div className="filter-chip">Min: {minCap} <span className="filter-chip-close" onClick={() => setMinCap('')}>×</span></div>}
                                        {maxCap && <div className="filter-chip">Max: {maxCap} <span className="filter-chip-close" onClick={() => setMaxCap('')}>×</span></div>}
                                        {sfusdOnly && <div className="filter-chip">SFUSD <span className="filter-chip-close" onClick={() => setSfusdOnly(false)}>×</span></div>}
                                        {prekOnly && <div className="filter-chip">PreK <span className="filter-chip-close" onClick={() => setPrekOnly(false)}>×</span></div>}
                                        {tkOnly && <div className="filter-chip">TK <span className="filter-chip-close" onClick={() => setTkOnly(false)}>×</span></div>}
                                        {headStartOnly && <div className="filter-chip">Head Start <span className="filter-chip-close" onClick={() => setHeadStartOnly(false)}>×</span></div>}
                                        {csppOnly && <div className="filter-chip">CSPP <span className="filter-chip-close" onClick={() => setCsppOnly(false)}>×</span></div>}
                                        {cctrOnly && <div className="filter-chip">CCTR <span className="filter-chip-close" onClick={() => setCctrOnly(false)}>×</span></div>}
                                        <button className="clear-all-btn" onClick={clearAllFilters}>Clear All</button>
                                    </div>
                                </div>
                            )}

                            <div className="filter-section">
                                <div className="filter-header" onClick={() => setOpen(open === 'district' ? '' : 'district')}>
                                    <span className="filter-title">Supervisor District</span>
                                    <span className={`filter-arrow ${open === 'district' ? 'open' : ''}`}>▼</span>
                                </div>
                                <div className={`filter-content ${open === 'district' ? 'open' : ''}`}>
                                    <div className="filter-body">
                                        {districts.map(dist => (
                                            <div key={dist.number} className="filter-option">
                                                <input type="checkbox" id={'district' + dist.number} checked={districtF.includes(dist.number)} onChange={() => toggle(districtF, setDistrictF, dist.number)} />
                                                <label htmlFor={'district' + dist.number}>District {dist.number} - {dist.name}</label>
                                                <span className="filter-count">{data.filter(f => f.supervisor_district === dist.number).length}</span>
                                            </div>
                                        ))}
                                        <div key="no-district" className="filter-option">
                                            <input type="checkbox" id="districtNone" checked={districtF.includes('none')} onChange={() => toggle(districtF, setDistrictF, 'none')} />
                                            <label htmlFor="districtNone">No District Info</label>
                                            <span className="filter-count">{data.filter(f => !f.supervisor_district).length}</span>
                                        </div>
                                        <div style={{padding: '8px 0', fontSize: '11px', color: '#666', lineHeight: '1.4'}}>
                                            District assignments based on address geocoding. {data.filter(f => !f.supervisor_district).length} facilities with ZIP-only locations may need manual verification.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {[
                                {id: 'type', title: 'Facility Type', items: types, filter: typeF, setFilter: setTypeF},
                                {id: 'status', title: 'License Status', items: statuses, filter: statusF, setFilter: setStatusF},
                                {id: 'elfa', title: 'ELFA Contracted', items: ['Yes', 'No'], filter: elfaF, setFilter: setElfaF}
                            ].map(({id, title, items, filter, setFilter}) => (
                                <div key={id} className="filter-section">
                                    <div className="filter-header" onClick={() => setOpen(open === id ? '' : id)}>
                                        <span className="filter-title">{title}</span>
                                        <span className={`filter-arrow ${open === id ? 'open' : ''}`}>▼</span>
                                    </div>
                                    <div className={`filter-content ${open === id ? 'open' : ''}`}>
                                        <div className="filter-body">
                                            {items.map(item => (
                                                <div key={item} className="filter-option">
                                                    <input type="checkbox" id={id + item} checked={filter.includes(item)} onChange={() => toggle(filter, setFilter, item)} />
                                                    <label htmlFor={id + item}>{item}</label>
                                                    <span className="filter-count">{data.filter(f => f[id === 'type' ? 'facility_type' : id === 'status' ? 'facility_status' : 'elfa_contracted'] === item).length}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}

                            <div className="filter-section">
                                <div className="filter-header" onClick={() => setOpen(open === 'cap' ? '' : 'cap')}>
                                    <span className="filter-title">Capacity</span>
                                    <span className={`filter-arrow ${open === 'cap' ? 'open' : ''}`}>▼</span>
                                </div>
                                <div className={`filter-content ${open === 'cap' ? 'open' : ''}`}>
                                    <div className="filter-body">
                                        <div className="capacity-inputs">
                                            <div className="capacity-input"><label>Min</label><input type="number" value={minCap} onChange={e => setMinCap(e.target.value)} placeholder="0" /></div>
                                            <div className="capacity-input"><label>Max</label><input type="number" value={maxCap} onChange={e => setMaxCap(e.target.value)} placeholder="580" /></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="filter-section">
                                <div className="filter-header" onClick={() => setOpen(open === 'special' ? '' : 'special')}>
                                    <span className="filter-title">Special</span>
                                    <span className={`filter-arrow ${open === 'special' ? 'open' : ''}`}>▼</span>
                                </div>
                                <div className={`filter-content ${open === 'special' ? 'open' : ''}`}>
                                    <div className="filter-body">
                                        <div className="filter-option">
                                            <input type="checkbox" id="sfusd" checked={sfusdOnly} onChange={e => setSfusdOnly(e.target.checked)} />
                                            <label htmlFor="sfusd">SFUSD</label>
                                            <span className="filter-count">{data.filter(f => f.sfusd_site === 'Yes').length}</span>
                                        </div>
                                        <div className="filter-option">
                                            <input type="checkbox" id="prek" checked={prekOnly} onChange={e => setPrekOnly(e.target.checked)} />
                                            <label htmlFor="prek">PreK</label>
                                            <span className="filter-count">{data.filter(f => f.prek_program).length}</span>
                                        </div>
                                        <div className="filter-option">
                                            <input type="checkbox" id="tk" checked={tkOnly} onChange={e => setTkOnly(e.target.checked)} />
                                            <label htmlFor="tk">TK</label>
                                            <span className="filter-count">{data.filter(f => f.tk_program).length}</span>
                                        </div>
                                        <div className="filter-option">
                                            <input type="checkbox" id="headstart" checked={headStartOnly} onChange={e => setHeadStartOnly(e.target.checked)} />
                                            <label htmlFor="headstart">Head Start</label>
                                            <span className="filter-count">{data.filter(f => f.head_start_program).length}</span>
                                        </div>
                                        <div className="filter-option">
                                            <input type="checkbox" id="cspp" checked={csppOnly} onChange={e => setCsppOnly(e.target.checked)} />
                                            <label htmlFor="cspp">CSPP</label>
                                            <span className="filter-count">{data.filter(f => f.cspp_program).length}</span>
                                        </div>
                                        <div className="filter-option">
                                            <input type="checkbox" id="cctr" checked={cctrOnly} onChange={e => setCctrOnly(e.target.checked)} />
                                            <label htmlFor="cctr">CCTR</label>
                                            <span className="filter-count">{data.filter(f => f.cctr_contractor).length}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="card">
                            <div className="map-header">
                                <div className="map-title">Geographic Distribution</div>
                                <div className="map-controls">
                                    <button className={`btn ${heatmap ? 'active' : ''}`} onClick={() => setHeatmap(!heatmap)}>Heatmap</button>
                                    <button className={`btn ${markers ? 'active' : ''}`} onClick={() => setMarkers(!markers)}>Markers</button>
                                    <button className={`btn ${mapBoundsFilter ? 'active' : ''}`} onClick={() => {
                                        setMapBoundsFilter(!mapBoundsFilter);
                                        if (!mapBoundsFilter && mapInst.current) {
                                            setCurrentBounds(mapInst.current.getBounds());
                                        }
                                    }}>Filter by Map</button>
                                    <button className="btn" onClick={() => mapInst.current?.setView([37.7749, -122.4194], 12)}>Reset</button>
                                </div>
                            </div>
                            <div id="map" ref={mapRef}></div>
                            <div className="map-note">
                                Click markers for details. Use scroll wheel to zoom. Click & drag to pan. Click "Filter by Map" to show only facilities in current view.
                                Legend shows status colors (green=licensed) and location accuracy (orange border=ZIP-based approximation).
                            </div>
                        </div>

                        <div>
                            <div className="card stats-card sidebar">
                                <h3>Quick Stats</h3>
                                {[
                                    {label: 'Total Facilities', val: stats.total, w: '100%'},
                                    {label: 'Total Capacity', val: stats.cap.toLocaleString(), w: '85%'},
                                    {label: 'Licensed', val: stats.licPct + '%', w: stats.licPct + '%'}
                                ].map((s, i) => (
                                    <div key={i} className="stat-item">
                                        <div className="stat-item-label">{s.label}</div>
                                        <div className="stat-row">
                                            <div className="stat-num">{s.val}</div>
                                            <div className="progress-bar"><div className="progress-fill" style={{width: s.w}}></div></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="card stats-card">
                                <h3>Capacity Distribution</h3>
                                <div className="chart-container"><canvas ref={chartRef}></canvas></div>
                            </div>
                        </div>
                    </div>

                    <div className="card" style={{padding: '20px'}}>
                        <div className="facilities-header">
                            <h2>Facilities</h2>
                            <div>Showing {(page-1)*perPage+1}-{Math.min(page*perPage, filtered.length)} of {filtered.length}</div>
                        </div>

                        {paged.map((f, i) => (
                            <div key={i} className="facility-card">
                                <div className="facility-header">
                                    <div className="facility-name">{f.facility_name}</div>
                                    <div className="badges">
                                        <span className={`badge ${f.facility_status === 'LICENSED' ? 'badge-licensed' : 'badge-closed'}`}>{f.facility_status}</span>
                                        {f.elfa_contracted === 'Yes' && <span className="badge badge-elfa">ELFA</span>}
                                        {f.sfusd_site === 'Yes' && <span className="badge badge-sfusd">SFUSD</span>}
                                        {f.prek_program && <span className="badge badge-prek">PreK</span>}
                                        {f.tk_program && <span className="badge badge-tk">TK</span>}
                                        {f.head_start_program && <span className="badge badge-headstart">HEAD START</span>}
                                        {f.cspp_program && <span className="badge badge-cspp">CSPP</span>}
                                        {f.cctr_contractor && <span className="badge badge-cctr">CCTR</span>}
                                        {f.tags?.address_source === 'zip_code_approximate' && <span className="badge" style={{background: '#fff3cd', color: '#856404'}}>ZIP</span>}
                                    </div>
                                </div>
                                <div className="facility-details">
                                    <div><strong>License #:</strong> {f.facility_number}</div>
                                    <div><strong>Type:</strong> {f.facility_type}</div>
                                    <div>{f.facility_address || `ZIP ${f.facility_zip} (address unavailable)`}, {f.facility_city} {f.facility_zip}</div>
                                    {f.supervisor_district && <div style={{marginTop: '4px'}}><strong>District {f.supervisor_district}:</strong> {f.supervisor_name}</div>}
                                    {f.neighborhood && <div style={{color: '#666', fontSize: '12px'}}>Neighborhood: {f.neighborhood}</div>}
                                    {f.sfusd_site === 'Yes' && f.sfusd_school_name && <div style={{color: '#673AB7', marginTop: '4px'}}>{f.sfusd_school_name}</div>}
                                </div>
                                <div className="facility-capacity">Capacity: {f.facility_capacity || 'N/A'}</div>
                            </div>
                        ))}

                        {totalPages > 1 && (
                            <div className="pagination">
                                <button className="page-btn" onClick={() => setPage(p => Math.max(1, p-1))} disabled={page === 1}>Prev</button>
                                {[...Array(Math.min(5, totalPages))].map((_, i) => {
                                    let p = totalPages <= 5 ? i + 1 : page <= 3 ? i + 1 : page >= totalPages - 2 ? totalPages - 4 + i : page - 2 + i;
                                    return <button key={i} className={`page-btn ${page === p ? 'active' : ''}`} onClick={() => setPage(p)}>{p}</button>;
                                })}
                                <button className="page-btn" onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page === totalPages}>Next</button>
                            </div>
                        )}
                    </div>
                </div>

                <div style={{display: tab === 'landscape' ? 'block' : 'none'}}>
                    {/* ==================== SUPPLY & DEMAND PANEL ==================== */}
                    <div className="landscape-panel">
                        <h2>Supply &amp; Demand</h2>

                        {/* Disclaimer */}
                        <div className="landscape-disclaimer">
                            Licensed child care is one of many care arrangements families use. This data shows licensed capacity relative to the child population &mdash; it does not represent total care needs or imply that all families require licensed slots. Note: Small family child care home (FCC) license data is not publicly available from CDSS, so the slot counts here only include small FCC homes with ELFA contracts. Actual licensed capacity citywide is higher than shown.
                        </div>

                        {/* Geographic lens selector */}
                        <div className="geo-selector">
                            {[
                                {key: 'citywide', label: 'Citywide'},
                                {key: 'district', label: 'District'},
                                {key: 'corridor', label: 'Corridor'},
                                {key: 'zip', label: 'ZIP Code'},
                                {key: 'pressure', label: 'Pressure Lens'}
                            ].map(g => (
                                <button key={g.key} className={`geo-btn ${geoView === g.key ? 'active' : ''}`}
                                    onClick={() => setGeoView(g.key)}>{g.label}</button>
                            ))}
                        </div>

                        {/* Demand Pressure Lens toggle — DISABLED in production until ready. */}
                        {/* All saturation-conditional code (pills, emojis, dynamic columns) */}
                        {/* is gated by `saturationOn` which defaults to false and stays off */}
                        {/* without this toggle. Re-enable by changing `false &&` → `true &&`. */}
                        {false && geoView !== 'pressure' && (
                            <div className="saturation-toggle-row">
                                <label className="saturation-toggle">
                                    <input type="checkbox" checked={saturationOn}
                                        onChange={e => setSaturationOn(e.target.checked)} />
                                    Show demand pressure
                                </label>
                                {saturationOn && (
                                    <div className="saturation-mode-row">
                                        <span>Mode:</span>
                                        <button className={`saturation-mode-btn ${saturationMode==='total'?'active':''}`}
                                            onClick={() => setSaturationMode('total')}>Total</button>
                                        <button className={`saturation-mode-btn ${saturationMode==='elfa'?'active':''}`}
                                            onClick={() => setSaturationMode('elfa')}>ELFA only</button>
                                    </div>
                                )}
                                {saturationOn && (
                                    <div style={{fontSize:'11px',color:'#888',marginLeft:'auto'}}>
                                        🔥 &lt;0.40 tight &nbsp;·&nbsp; ↔️ 0.40–0.70 balanced &nbsp;·&nbsp; 🧊 &gt;0.70 slack
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ===== CITYWIDE VIEW ===== */}
                        {geoView === 'citywide' && <>
                            <SaturationPill
                                slots={saturationMode === 'elfa' ? (supplyByDistrict.total?.elfaCap || 0) : (supplyByDistrict.total?.totalCap || 0)}
                                children={demandTotals.under6 || 0}
                                mode={saturationMode} />
                            <div className="landscape-cards">
                                <div className="landscape-card">
                                    <div className="lc-value">{supplyByDistrict.total?.totalCap?.toLocaleString() || '...'}</div>
                                    <div className="lc-label">Licensed Slots</div>
                                    <div className="lc-context">Serving {demandTotals.under6?.toLocaleString()} children under 6 (all incomes)</div>
                                </div>
                                <div className={'landscape-card' + (saturationOn ? ' sat-row-' + getSaturation(saturationMode === 'elfa' ? (supplyByDistrict.total?.elfaCap || 0) : (supplyByDistrict.total?.totalCap || 0), demandTotals.under6).color : '')}>
                                    <div className="lc-value">{(() => {
                                        const slots = saturationMode === 'elfa' ? (supplyByDistrict.total?.elfaCap || 0) : (supplyByDistrict.total?.totalCap || 0);
                                        return demandTotals.under6 > 0 ? (slots / demandTotals.under6).toFixed(2) : '...';
                                    })()}</div>
                                    <div className="lc-label">{saturationOn && saturationMode === 'elfa' ? 'ELFA Slots/Child' : 'Slots per Child'}</div>
                                    <div className="lc-context">Many families use parental, FFN, or license-exempt care by choice</div>
                                </div>
                                <div className="landscape-card">
                                    <div className="lc-value">{supplyByDistrict.total?.elfaCap?.toLocaleString() || '...'}</div>
                                    <div className="lc-label">ELFA Contracted</div>
                                    <div className="lc-context">{supplyByDistrict.total?.totalCap > 0 ? Math.round((supplyByDistrict.total?.elfaCap || 0) / supplyByDistrict.total.totalCap * 100) : 0}% of all licensed capacity</div>
                                </div>
                                <div className="landscape-card">
                                    <div className="lc-value">{supplyByDistrict.total?.infantCap?.toLocaleString() || '...'}</div>
                                    <div className="lc-label">Infant/Toddler Slots</div>
                                    <div className="lc-context">Relative to {demandTotals.under3?.toLocaleString()} children under 3</div>
                                </div>
                                <div className="landscape-card">
                                    <div className="lc-value">{demandTotals.le110?.toLocaleString() || '...'}</div>
                                    <div className="lc-label">HH w/ Kids &lt;6 &le;110% AMI</div>
                                    <div className="lc-context">Currently fully funded ELFA tier</div>
                                </div>
                                <div className="landscape-card">
                                    <div className="lc-value">{demandTotals.le110 != null ? (demandTotals.le110 + demandTotals.b110_150 + demandTotals.b150_200).toLocaleString() : '...'}</div>
                                    <div className="lc-label">HH w/ Kids &lt;6 &le;200% AMI</div>
                                    <div className="lc-context">Full ELFA-eligible pool after July 2026</div>
                                </div>

                                            <th style={{borderLeft:'2px solid #ccc'}}>Total</th><th>Spa</th><th>Chi</th><th>Eng</th>
                                            <th style={{borderLeft:'2px solid #ccc'}}>Total</th><th>Spa</th><th>Chi</th><th>Eng</th>
                                            <th style={{borderLeft:'2px solid #ccc'}}>Total</th><th>Spa</th><th>Chi</th><th>Eng</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {ELFA_EXPANSION.priorityDistricts.map(d => {
                                            const a = expansionImpact.allocA.find(x => x.d === d) || {slots:0,spaSlots:0,chiSlots:0,engSlots:0};
                                            const b = expansionImpact.allocB.find(x => x.d === d) || {slots:0,spaSlots:0,chiSlots:0,engSlots:0};
                                            const c = expansionImpact.allocC.find(x => x.d === d) || {slots:0,spaSlots:0,chiSlots:0,engSlots:0};
                                            return (
                                                <tr key={d}>
                                                    <td><strong>D{d}</strong></td>
                                                    <td style={{borderLeft:'2px solid #ccc'}}><strong>{a.slots}</strong></td>
                                                    <td>{Math.round(a.spaSlots)}</td>
                                                    <td>{Math.round(a.chiSlots)}</td>
                                                    <td>{Math.round(a.engSlots)}</td>
                                                    <td style={{borderLeft:'2px solid #ccc'}}><strong>{b.slots}</strong></td>
                                                    <td>{Math.round(b.spaSlots)}</td>
                                                    <td>{Math.round(b.chiSlots)}</td>
                                                    <td>{Math.round(b.engSlots)}</td>
                                                    <td style={{borderLeft:'2px solid #ccc'}}><strong>{c.slots}</strong></td>
                                                    <td>{Math.round(c.spaSlots)}</td>
                                                    <td>{Math.round(c.chiSlots)}</td>
                                                    <td>{Math.round(c.engSlots)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            <div style={{marginTop:'14px',fontSize:'13px',color:'#444',lineHeight:1.65,padding:'12px 14px',background:'#fff5f5',borderLeft:'3px solid #c0392b',borderRadius:'4px'}}>
                                <strong>Bottom line.</strong> Under the announced ranking, Scenario A is the most likely outcome. ~{expansionImpact.scenarioA.addChi} of the 750 new slots flow to Chinese-capable programs (already over-supplied at {expansionImpact.scenarioA.chiRate.toFixed(1)} per 100 kids); only ~{expansionImpact.scenarioA.addSpa} reach Spanish-capable programs (still {expansionImpact.scenarioA.spaRate.toFixed(1)} per 100 kids in priority districts). The expansion will further widen the language gap unless DEC explicitly weights language access into the ranking, runs Spanish-language outreach during the application window, or recruits new Spanish-speaking FCCs into the network. The 5-point infant/toddler bonus is the dominant factor; everything else is a tiebreaker.
                            </div>

                            <h3 style={{marginTop:'28px'}}>The Voice Gap</h3>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
                                <div>
                                    <div className="chart-subtitle" style={{marginBottom:'8px'}}>Who is registered vs who is licensed</div>
                                    <div className="landscape-table-wrap">
                                        <table className="landscape-table">
                                            <tbody>
                                                <tr><td style={{textAlign:'left'}}>CCLD-Licensed FCC Homes</td><td>{voiceGapTotals.totalCcldFcc.toLocaleString()}</td></tr>
                                                <tr><td style={{textAlign:'left'}}>Self-Registered Providers</td><td>{voiceGapTotals.registeredN}</td></tr>
                                                <tr><td style={{textAlign:'left'}}>Voice Coverage</td><td>{(voiceGapTotals.voiceCoverage * 100).toFixed(0)}%</td></tr>
                                                <tr><td style={{textAlign:'left'}}>Silent FCCs (no registry presence)</td><td>{(voiceGapTotals.totalCcldFcc - voiceGapTotals.registeredN).toLocaleString()}</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div>
                                    <div className="chart-subtitle" style={{marginBottom:'8px'}}>Voices in the registry, by language (raw counts &mdash; not normalized against the registry total, which is itself biased)</div>
                                    <div className="landscape-table-wrap">
                                        <table className="landscape-table">
                                            <thead><tr><th style={{textAlign:'left'}}>Language</th><th>Voices</th><th>SF residents</th><th>Per 10K residents</th></tr></thead>
                                            <tbody>
                                                <tr><td style={{textAlign:'left'}}>English (only)</td><td>{voiceGapTotals.voices.English}</td><td>{voiceGapTotals.pop.eng.toLocaleString()}</td><td>{voiceGapTotals.coverage.eng.toFixed(2)}</td></tr>
                                                <tr><td style={{textAlign:'left'}}>Chinese (Can+Man unique)</td><td>{voiceGapTotals.voices.Chinese}</td><td>{voiceGapTotals.pop.chi.toLocaleString()}</td><td>{voiceGapTotals.coverage.chi.toFixed(2)}</td></tr>
                                                <tr><td style={{textAlign:'left'}}>&nbsp;&nbsp;&nbsp;Cantonese</td><td>{voiceGapTotals.voices.Cantonese}</td><td>&mdash;</td><td>&mdash;</td></tr>
                                                <tr><td style={{textAlign:'left'}}>&nbsp;&nbsp;&nbsp;Mandarin</td><td>{voiceGapTotals.voices.Mandarin}</td><td>&mdash;</td><td>&mdash;</td></tr>
                                                <tr><td style={{textAlign:'left'}}>Spanish</td><td>{voiceGapTotals.voices.Spanish}</td><td>{voiceGapTotals.pop.spa.toLocaleString()}</td><td>{voiceGapTotals.coverage.spa.toFixed(2)}</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div style={{marginTop:'10px',fontSize:'12px',color:'#666',lineHeight:1.5}}>
                                        SF Mission (94110) has 5,503 households with kids under 6 and a large Hispanic provider base. The registry holds <strong>1</strong> Spanish-speaking provider in 94110. If a roomful of Hispanic providers say they're "fine," the registry suggests the harder question is who isn't in that room.
                                    </div>
                                </div>
                            </div>
                        </>}
                    </div>
                    {/* ==================== END SUPPLY & DEMAND ==================== */}

                </div>


                </div>

                {modal && (
                    <div className="modal-overlay" onClick={() => setModal(false)}>
                        <div className="modal" onClick={e => e.stopPropagation()}>
                            <div className="modal-header">
                                <h2>Data &amp; Methodology</h2>
                                <button className="modal-close" onClick={() => setModal(false)}>×</button>
                            </div>

                            {tab === 'landscape' && <>
                            <div className="modal-section">
                                <h3>Supply Data</h3>
                                <p><strong>Source:</strong> California Community Care Licensing Division (CCLD) facility data, cross-referenced with SF Department of Early Childhood ELFA program records.</p>
                                <p><strong>Licensed Capacity:</strong> Total slots reported on each facility's license. Includes Day Care Centers, Infant Centers, and Large Family Child Care Homes with status "LICENSED."</p>
                                <p><strong>ELFA Contracted:</strong> Facilities flagged as ELFA-contracted in SFDEC data. ELFA capacity = total licensed capacity of those facilities. Note: not all slots at an ELFA site may be subsidized.</p>
                                <p><strong>Infant/Toddler Slots:</strong> Licensed capacity of facilities classified as "INFANT CENTER" by CCLD. Does not include infant slots within mixed-age centers.</p>
                            </div>
                            <div className="modal-section">
                                <h3>Demand &amp; Population Data</h3>
                                <p><strong>Source:</strong> American Community Survey (ACS) 2020&ndash;2024 5-year estimates at the census tract level, aggregated to SF Supervisor Districts using DataSF boundary files.</p>
                                <p><strong>Children Under 6:</strong> Total child population by age group (under 3, ages 3&ndash;4, age 5) from ACS table B09001. This counts all children in the district regardless of household income. This is a different unit from household counts.</p>
                                <p><strong>Household Income:</strong> Households with children under 6 are derived from ACS S1101: the count of HH with children under 18 (S1101_C01_005E) multiplied by the percentage with children under 6 (S1101_C01_006E + S1101_C01_007E). These are then distributed across AMI bands using B19001 income data and MOHCD 2025 thresholds. These are household counts, not child counts &mdash; a different metric from the child population figures.</p>
                            </div>
                            <div className="modal-section">
                                <h3>AMI Thresholds (MOHCD 2025)</h3>
                                <p>Area Median Income (AMI) is set annually by the Mayor's Office of Housing and Community Development. For a family of four in San Francisco:</p>
                                <p>
                                    <strong>&le;110% AMI:</strong> &le;$167,750 &mdash; ELFA fully funded (FREE)<br/>
                                    <strong>110&ndash;150% AMI:</strong> $167,751&ndash;$228,750 &mdash; ELFA 100% tuition credit<br/>
                                    <strong>150&ndash;200% AMI:</strong> $228,751&ndash;$305,000 &mdash; ELFA 50% tuition credit (effective 7/1/2026)<br/>
                                    <strong>&gt;200% AMI:</strong> &gt;$305,000 &mdash; Market rate
                                </p>
                            </div>
                            <div className="modal-section">
                                <h3>Key Definitions</h3>
                                <p><strong>ELFA (Early Learning for All):</strong> San Francisco's universal early care and education initiative administered by the Department of Early Childhood.</p>
                                <p><strong>AMI (Area Median Income):</strong> Regional income benchmark used to determine eligibility for housing and social programs.</p>
                                <p><strong>FFN (Family, Friend, or Neighbor) Care:</strong> Informal care by relatives, friends, or neighbors &mdash; not tracked in licensing data.</p>
                                <p><strong>Slots per Child:</strong> Licensed capacity divided by child population. A ratio, not an indicator of availability or need. Many families choose non-licensed arrangements.</p>
                            </div>
                            <div className="modal-section">
                                <h3>Limitations &amp; Caveats</h3>
                                <p><strong>Different data sources:</strong> Household counts (ACS S1101) and child population counts (ACS B09001) come from different ACS tables with different survey universes. Household counts measure families; child counts measure individuals. These should not be directly compared as equivalent units.</p>
                                <p><strong>Household variable:</strong> Households with children under 6 are derived from S1101_C01_005E (HH with children under 18) multiplied by the under-6 sub-category percentages (S1101_C01_006E + S1101_C01_007E). AMI band distributions are modeled estimates, not direct survey responses.</p>
                                <p><strong>ACS sampling:</strong> All numbers are sample estimates with margins of error, especially at small geographies like ZCTAs. AMI band assignments are approximate &mdash; actual household eligibility depends on family size and current income.</p>
                                <p><strong>Geography:</strong> District boundaries follow the 2022 redistricting. Data is aggregated from ZCTAs to districts using population-weighted census block intersections.</p>
                                <p><strong>Licensed capacity</strong> reflects what a facility is licensed to serve, not current enrollment or available openings.</p>
                            </div>
                            </>}

                            {tab === 'programs' && <>
                            <div className="modal-section">
                                <h3>Data Limitation</h3>
                                <p>This dashboard includes licensed child care <strong>centers and large Family Child Care (FCC)</strong> facilities from CCLD data. <strong>Small FCCs are not included</strong> as they must be deduced from combining SFDEC and CCLD large FCC data using license numbers.</p>
                                <p><strong>Coverage:</strong><br/>Day Care Centers<br/>Large FCCs<br/>Small FCCs (requires cross-reference)</p>
                            </div>
                            <div className="modal-section">
                                <h3>Location Data</h3>
                                <p>Most facilities have been geocoded to precise addresses. Facilities without street addresses (typically small family child care homes) are displayed using <strong>jittered ZIP code centroids</strong> - approximate locations with small random offsets to prevent stacking.</p>
                                <p><strong>Map Legend:</strong><br/>White-bordered markers: Geocoded addresses<br/>Orange-bordered markers: ZIP-based (jittered)</p>
                            </div>
                            <div className="modal-section">
                                <h3>Supervisor District Data</h3>
                                <p><strong>Coverage:</strong> 1,100 out of 1,144 facilities (96%) have been assigned to supervisor districts.</p>
                                <p><strong>Assignment Method:</strong><br/>
                                488 facilities: Exact match via address database<br/>
                                612 facilities: Proximity match (within 100 meters)<br/>
                                44 facilities: No district assignment (ZIP-based approximations)</p>
                                <p><strong>Important Limitations:</strong><br/>
                                Facilities with ZIP-only locations may be near district borders. Their assigned districts should be verified manually for accuracy. Use the "No District Info" filter to identify these facilities.</p>
                                <p><strong>Current Supervisors:</strong> Data reflects supervisors as of December 2024.</p>
                            </div>
                            <div className="modal-section">
                                <h3>Head Start Programs</h3>
                                <p><strong>Coverage:</strong> 46 facilities are affiliated with federally-funded Head Start programs serving low-income families.</p>
                                <p><strong>Programs Included:</strong><br/>
                                Wu Yee Children's Services: 21 facilities<br/>
                                Kai Ming Head Start: 13 facilities<br/>
                                Mission Head Start: 12 facilities</p>
                                <p>Head Start facilities are tagged throughout the dashboard with an orange <span style={{background: '#fff3e0', color: '#e65100', padding: '2px 6px', borderRadius: '8px', fontSize: '10px', fontWeight: '600'}}>HEAD START</span> badge and can be filtered using the "Head Start" checkbox in Special filters.</p>
                            </div>
                            <div className="modal-section">
                                <h3>CSPP (California State Preschool Program)</h3>
                                <p><strong>Coverage:</strong> 70 facilities participate in the state-funded California State Preschool Program.</p>
                                <p><strong>Programs Included:</strong> Chinatown Community, Compass Family Services, FACES SF, Holy Family Day Home, Kai Ming, Mission Child Care Consortium, Nihonmachi Little Friends, South of Market Child Care, and Wu Yee Children's Services.</p>
                                <p><strong>Overlap with Head Start:</strong> 46 facilities participate in both federal Head Start and state CSPP programs, providing comprehensive early childhood education funding.</p>
                                <p>CSPP facilities are tagged with a green <span style={{background: '#e8f5e9', color: '#2e7d32', padding: '2px 6px', borderRadius: '8px', fontSize: '10px', fontWeight: '600'}}>CSPP</span> badge and can be filtered using the "CSPP" checkbox in Special filters.</p>
                            </div>
                            <div className="modal-section">
                                <h3>CCTR (California Child Care & Development Services)</h3>
                                <p>Facilities contracted through the CCTR program are tagged with a green <span style={{background: '#c8e6c9', color: '#2e7d32', padding: '2px 6px', borderRadius: '8px', fontSize: '10px', fontWeight: '600'}}>CCTR</span> badge and can be filtered by contractor.</p>
                                <p><strong>FY24-25 CCTR Contractors:</strong><br/>Mission Neighborhood Centers, Inc.<br/>South of Market Child Care Inc.<br/>Wu Yee Children's Services</p>
                            </div>
                            <div className="modal-section">
                                <h3>Data Sources</h3>
                                <ul>
                                    <li><a href="https://sfdec.org/early-learning-for-all/early-learning-programs/" target="_blank">ELFA - SF Dept Early Childhood</a></li>
                                    <li><a href="https://www.ccld.dss.ca.gov/carefacilitysearch/DownloadData" target="_blank">CCLD - CA Licensing</a></li>
                                    <li><a href="https://www.sfusd.edu/schools/directory/table?field_school_type_target_id%5B317%5D=317" target="_blank">SFUSD Directory</a></li>
                                    <li><a href="https://cdss.ca.gov/inforesources/child-care-and-development/contractor-resources/general-child-care-and-development-cctr-expansion/fy-24-25" target="_blank">CCTR - CA Dept of Social Services (FY 24-25)</a></li>
                                    <li><a href="https://www.cde.ca.gov/fg/fo/r2/cspp2425fundresults.asp" target="_blank">CSPP - CA Dept of Education (FY 24-25)</a></li>
                                </ul>
                            </div>
                            </>}
                        </div>
                    </div>
                )}
            </div>;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
