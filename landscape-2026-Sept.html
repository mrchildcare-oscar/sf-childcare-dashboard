        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ===== Shareable URL state =====
        // Read once at load so filters/selections can be restored from a shared link.
        // Defaults are omitted when writing back, so a pristine view = clean URL.
        const SHARE_PARAMS = new URLSearchParams(window.location.search);
        const pStr  = (k, d) => SHARE_PARAMS.has(k) ? SHARE_PARAMS.get(k) : d;
        const pBool = (k, d) => SHARE_PARAMS.has(k) ? SHARE_PARAMS.get(k) === '1' : d;
        const pInt  = (k, d) => SHARE_PARAMS.has(k) ? (parseInt(SHARE_PARAMS.get(k), 10) || d) : d;
        const pArr  = (k, d) => SHARE_PARAMS.has(k) ? (SHARE_PARAMS.get(k) ? SHARE_PARAMS.get(k).split(',') : []) : d;

        const App = () => {
            const [data, setData] = useState([]);
            const [search, setSearch] = useState(() => pStr('q', ''));
            const [open, setOpen] = useState('type');
            const [typeF, setTypeF] = useState(() => pArr('type', []));
            const [statusF, setStatusF] = useState(() => pArr('status', ['LICENSED']));
            const [elfaF, setElfaF] = useState(() => pArr('elfa', []));
            const [minCap, setMinCap] = useState(() => pStr('min', ''));
            const [maxCap, setMaxCap] = useState(() => pStr('max', ''));
            const [sfusdOnly, setSfusdOnly] = useState(() => pBool('sfusd', false));
            const [prekOnly, setPrekOnly] = useState(() => pBool('prek', false));
            const [tkOnly, setTkOnly] = useState(() => pBool('tk', false));
            const [headStartOnly, setHeadStartOnly] = useState(() => pBool('hs', false));
            const [csppOnly, setCsppOnly] = useState(() => pBool('cspp', false));
            const [cctrOnly, setCctrOnly] = useState(() => pBool('cctr', false));
            const [districtF, setDistrictF] = useState(() => pArr('dist', []));
            const [heatmap, setHeatmap] = useState(() => pBool('heat', true));
            const [markers, setMarkers] = useState(() => pBool('mark', true));
            const [modal, setModal] = useState(false);
            const [page, setPage] = useState(1);
            const [tab, setTab] = useState(() => pStr('tab', 'landscape'));
            const [copied, setCopied] = useState(false);
            const [mapBoundsFilter, setMapBoundsFilter] = useState(false);
            const [currentBounds, setCurrentBounds] = useState(null);

            const perPage = 25;

            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const heatLayer = useRef(null);
            const markerLayer = useRef(null);
            const chartRef = useRef(null);
            const chartInst = useRef(null);
            const landscapeChartRef = useRef(null);
            const landscapeChartInst = useRef(null);
            const districtMapRef = useRef(null);
            const districtMapInst = useRef(null);
            const corridorMapRef = useRef(null);
            const corridorMapInst = useRef(null);
            const [districtGeo, setDistrictGeo] = useState(null);

            useEffect(() => {
                if (window.CHILDCARE_DATA) {
                    setData(window.CHILDCARE_DATA);
                } else {
                    window.onDataLoad = () => setData(window.CHILDCARE_DATA);
                }
                if (window.DISTRICT_GEO) {
                    setDistrictGeo(window.DISTRICT_GEO);
                } else {
                    window.onDistrictGeoLoad = () => setDistrictGeo(window.DISTRICT_GEO);
                }
            }, []);

            const types = useMemo(() => {
                const uniqueTypes = [...new Set(data.map(f => f.facility_type))];
                return uniqueTypes.sort((a, b) => {
                    const aIsFamily = a.includes('FAMILY CHILD CARE HOME');
                    const bIsFamily = b.includes('FAMILY CHILD CARE HOME');
                    if (aIsFamily === bIsFamily) {
                        if (aIsFamily) {
                            if (a.includes('SMALL')) return -1;
                            if (b.includes('SMALL')) return 1;
                        }
                        return a.localeCompare(b);
                    }
                    return aIsFamily ? 1 : -1;
                });
            }, [data]);
            const statuses = useMemo(() => [...new Set(data.map(f => f.facility_status))].sort(), [data]);

            const districts = useMemo(() => {
                const dists = data.filter(f => f.supervisor_district).map(f => ({
                    number: f.supervisor_district,
                    name: f.supervisor_name
                }));
                const unique = [...new Map(dists.map(d => [d.number, d])).values()];
                return unique.sort((a, b) => parseInt(a.number) - parseInt(b.number));
            }, [data]);

            const filtered = useMemo(() => {
                let f = [...data];
                if (search) {
                    const s = search.toLowerCase();
                    f = f.filter(x => x.facility_name?.toLowerCase().includes(s) ||
                                      x.facility_address?.toLowerCase().includes(s) ||
                                      x.sfusd_school_name?.toLowerCase().includes(s) ||
                                      String(x.facility_number).includes(s) ||
                                      String(x.facility_zip).includes(s));
                }
                if (typeF.length) f = f.filter(x => typeF.includes(x.facility_type));
                if (statusF.length) f = f.filter(x => statusF.includes(x.facility_status));
                if (elfaF.length) f = f.filter(x => elfaF.includes(x.elfa_contracted));
                if (districtF.length) f = f.filter(x => {
                    if (districtF.includes('none')) {
                        return districtF.includes(x.supervisor_district) || !x.supervisor_district;
                    }
                    return districtF.includes(x.supervisor_district);
                });
                if (minCap) f = f.filter(x => (x.facility_capacity || 0) >= parseInt(minCap));
                if (maxCap) f = f.filter(x => (x.facility_capacity || 0) <= parseInt(maxCap));
                if (sfusdOnly) f = f.filter(x => x.sfusd_site === 'Yes');
                if (prekOnly) f = f.filter(x => x.prek_program);
                if (tkOnly) f = f.filter(x => x.tk_program);
                if (headStartOnly) f = f.filter(x => x.head_start_program);
                if (csppOnly) f = f.filter(x => x.cspp_program);
                if (cctrOnly) f = f.filter(x => x.cctr_contractor);
                if (mapBoundsFilter && currentBounds) {
                    f = f.filter(x => {
                        if (!x.latitude || !x.longitude) return false;
                        return currentBounds.contains([x.latitude, x.longitude]);
                    });
                }
                return f;
            }, [data, search, typeF, statusF, elfaF, districtF, minCap, maxCap, sfusdOnly, prekOnly, tkOnly, headStartOnly, csppOnly, cctrOnly, mapBoundsFilter, currentBounds]);

            const stats = useMemo(() => {
                const cap = filtered.reduce((s, f) => s + (f.facility_capacity || 0), 0);
                const lic = filtered.filter(f => f.facility_status === 'LICENSED').length;
                const sfu = filtered.filter(f => f.sfusd_site === 'Yes').length;
                const cctr = filtered.filter(f => f.cctr_contractor).length;
                const headStart = filtered.filter(f => f.head_start_program).length;
                const cspp = filtered.filter(f => f.cspp_program).length;
                return {
                    total: filtered.length,
                    cap: cap,
                    lic: lic,
                    licPct: filtered.length > 0 ? Math.round((lic / filtered.length) * 100) : 0,
                    sfu: sfu,
                    cctr: cctr,
                    headStart: headStart,
                    cspp: cspp
                };
            }, [filtered]);

            // ===== Supply aggregates for landscape panel (uses full dataset, not filtered) =====
            const supplyByDistrict = useMemo(() => {
                const licensed = data.filter(f => f.facility_status === 'LICENSED');
                const result = {};
                for (let i = 1; i <= 11; i++) {
                    const distStr = String(i);
                    const inDist = licensed.filter(f => f.supervisor_district === distStr);
                    const fccTypes = ['SMALL FAMILY CHILD CARE HOME', 'LARGE FAMILY CHILD CARE HOME'];
                    result[i] = {
                        totalCap: inDist.reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        elfaCap: inDist.filter(f => f.elfa_contracted === 'Yes').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        elfaCount: inDist.filter(f => f.elfa_contracted === 'Yes').length,
                        infantCap: inDist.filter(f => f.facility_type === 'INFANT CENTER').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        fccCount: inDist.filter(f => fccTypes.includes(f.facility_type)).length,
                        fccCap: inDist.filter(f => fccTypes.includes(f.facility_type)).reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        count: inDist.length
                    };
                }
                // Citywide totals
                const fccTypes = ['SMALL FAMILY CHILD CARE HOME', 'LARGE FAMILY CHILD CARE HOME'];
                result.total = {
                    totalCap: licensed.reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    elfaCap: licensed.filter(f => f.elfa_contracted === 'Yes').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    elfaCount: licensed.filter(f => f.elfa_contracted === 'Yes').length,
                    infantCap: licensed.filter(f => f.facility_type === 'INFANT CENTER').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                    fccCount: licensed.filter(f => fccTypes.includes(f.facility_type)).length,
                    count: licensed.length
                };
                return result;
            }, [data]);

            const demandTotals = useMemo(() => {
                const t = { total_hh: 0, le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0 };
                DEMAND_DATA.forEach(d => {
                    Object.keys(t).forEach(k => { t[k] += d[k]; });
                });
                t.under6 = t.under3 + t.age3_4 + t.age5;
                return t;
            }, []);

            // ===== Geographic lens state =====
            const [geoView, setGeoView] = useState(() => pStr('geo', 'citywide'));
            const [selectedDistrict, setSelectedDistrict] = useState(() => pInt('d', 1));
            const [selectedZip, setSelectedZip] = useState(() => pStr('zip', '94102'));

            // ===== Demand Pressure Lens state =====
            // Neutral framing — reads supply/demand pressure without "good/bad" valence.
            // Bands: <0.40 tight (high demand pressure), 0.40-0.70 balanced (~SF avg 0.55),
            // >0.70 slack (supply outpaces demand). Anchor: federal "child care desert" = <0.33.
            // Pinned OFF 2026-09-08. This lens expressed licensed slots divided by children
            // under six - a coverage rate over mismatched age bands, the error explainer.html
            // retracted and served.html bans. The ratio displays are gone; this stops a stray
            // ?sat=1 link resurrecting the banded labels without the arithmetic behind them.
            // Machinery left in place (19 call sites: row colour, sort keys, memo deps) - every
            // consumer guards on saturationOn, so false makes it inert.
            const [saturationOn, setSaturationOn] = useState(false);
            const [saturationMode, setSaturationMode] = useState(() => pStr('satmode', 'total')); // 'total' | 'elfa'

            // Retained but inert: nothing calls this for display any more.
            // Color uses a neutral teal-intensity gradient (no red/green moral coding).
            const getSaturation = (slots, children) => {
                if (!children || children <= 0) return { ratio: null, label: 'No data', color: 'unknown', emoji: '⚪' };
                const ratio = slots / children;
                if (ratio < 0.40) return { ratio, label: 'Tight supply',  color: 'tight',    emoji: '🔥' };
                if (ratio < 0.70) return { ratio, label: 'Balanced',      color: 'balanced', emoji: '↔️' };
                return                  { ratio, label: 'Slack supply',  color: 'slack',    emoji: '🧊' };
            };

            // Demand-pressure pill — renders nothing when toggle is off.
            // Help text gives explicit audience-specific interpretation since the same
            // data means different things to parents, providers, and policymakers.
            const SaturationPill = ({slots, children, mode}) => {
                if (!saturationOn) return null;
                const sat = getSaturation(slots, children);
                if (sat.ratio === null) return (
                    <div className={'saturation-pill sat-unknown'}>{sat.emoji} {sat.label}</div>
                );
                const isElfa = mode === 'elfa';
                return (
                    <div>
                        <div className={'saturation-pill sat-' + sat.color}>
                            {sat.emoji} {sat.label}
                        </div>
                        <div className="sat-pill-help">
                            <strong>{isElfa ? 'ELFA-contracted slots' : 'Licensed slots'} ÷ children under 6.</strong>{' '}
                            {isElfa ? 'Tighter = harder for low-income families to find subsidized care.' : 'SF average ≈ 0.55. Federal "child care desert" floor = 0.33.'}
                            <br/>
                            <span style={{fontSize:'10px',color:'#888'}}>
                                Reads differently per audience: 👨‍👩‍👧 parents — tighter = waitlists likely;{' '}
                                🏢 providers — tighter = strong demand, lighter competition;{' '}
                                🏛️ policy/advocacy — tighter = supply gap to address
                            </span>
                        </div>
                    </div>
                );
            };

            // ===== Corridor analysis =====
            const [corridor, setCorridor] = useState(() => pStr('cor', 'Westside'));

            // ===== Keep the address bar in sync with the current view =====
            // Writes only non-default values, then a shared link restores the exact
            // filters/selections that produced the numbers on screen.
            useEffect(() => {
                const p = new URLSearchParams();
                if (tab !== 'landscape') p.set('tab', tab);
                if (search) p.set('q', search);
                if (typeF.length) p.set('type', typeF.join(','));
                const statusDefault = statusF.length === 1 && statusF[0] === 'LICENSED';
                if (!statusDefault) p.set('status', statusF.join(','));
                if (elfaF.length) p.set('elfa', elfaF.join(','));
                if (minCap) p.set('min', minCap);
                if (maxCap) p.set('max', maxCap);
                if (districtF.length) p.set('dist', districtF.join(','));
                if (sfusdOnly) p.set('sfusd', '1');
                if (prekOnly) p.set('prek', '1');
                if (tkOnly) p.set('tk', '1');
                if (headStartOnly) p.set('hs', '1');
                if (csppOnly) p.set('cspp', '1');
                if (cctrOnly) p.set('cctr', '1');
                if (!heatmap) p.set('heat', '0');
                if (!markers) p.set('mark', '0');
                if (geoView !== 'citywide') p.set('geo', geoView);
                if (selectedDistrict !== 1) p.set('d', String(selectedDistrict));
                if (selectedZip !== '94102') p.set('zip', selectedZip);
                if (corridor !== 'Westside') p.set('cor', corridor);
                if (saturationOn) p.set('sat', '1');
                if (saturationMode !== 'total') p.set('satmode', saturationMode);
                const qs = p.toString();
                const url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
                window.history.replaceState(null, '', url);
            }, [tab, search, typeF, statusF, elfaF, minCap, maxCap, districtF, sfusdOnly,
                prekOnly, tkOnly, headStartOnly, csppOnly, cctrOnly, heatmap, markers,
                geoView, selectedDistrict, selectedZip, corridor, saturationOn, saturationMode]);

            // Copy a link to the current view to the clipboard (URL is already in sync).
            const copyShareLink = useCallback(() => {
                const url = window.location.href;
                const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(done).catch(() => window.prompt('Copy this link:', url));
                } else {
                    window.prompt('Copy this link:', url);
                }
            }, []);

            const corridorDemand = useMemo(() => {
                const dists = CORRIDORS[corridor] || [];
                return DEMAND_DATA.filter(d => dists.includes(d.district));
            }, [corridor]);

            const corridorDemandTotals = useMemo(() => {
                const t = { total_hh: 0, le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0 };
                corridorDemand.forEach(d => { Object.keys(t).forEach(k => { t[k] += d[k]; }); });
                t.under6 = t.under3 + t.age3_4 + t.age5;
                return t;
            }, [corridorDemand]);

            const corridorSupplyTotals = useMemo(() => {
                const dists = CORRIDORS[corridor] || [];
                return {
                    totalCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.totalCap || 0), 0),
                    elfaCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.elfaCap || 0), 0),
                    infantCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.infantCap || 0), 0),
                };
            }, [corridor, supplyByDistrict]);

            const allCorridorsTotals = useMemo(() => {
                return Object.entries(CORRIDORS).map(([name, dists]) => {
                    const supply = {
                        totalCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.totalCap || 0), 0),
                        elfaCap: dists.reduce((s, d) => s + (supplyByDistrict[d]?.elfaCap || 0), 0),
                        fccCount: dists.reduce((s, d) => s + (supplyByDistrict[d]?.fccCount || 0), 0),
                        count: dists.reduce((s, d) => s + (supplyByDistrict[d]?.count || 0), 0),
                    };
                    const demand = { le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0 };
                    DEMAND_DATA.filter(d => dists.includes(d.district)).forEach(d => {
                        Object.keys(demand).forEach(k => { demand[k] += d[k]; });
                    });
                    demand.under6 = demand.under3 + demand.age3_4 + demand.age5;
                    return { name, dists, supply, demand };
                });
            }, [supplyByDistrict]);

            // ===== Selected district derived data =====
            const selectedDistrictDemand = useMemo(() => DEMAND_DATA.find(d => d.district === selectedDistrict) || DEMAND_DATA[0], [selectedDistrict]);
            const selectedDistrictSupply = useMemo(() => supplyByDistrict[selectedDistrict] || {totalCap:0,elfaCap:0,infantCap:0,count:0}, [selectedDistrict, supplyByDistrict]);

            // ===== ZIP code analysis =====
            const [zipSortCol, setZipSortCol] = useState('zip');
            const [zipSortAsc, setZipSortAsc] = useState(true);
            const handleZipSort = (col) => {
                if (zipSortCol === col) { setZipSortAsc(!zipSortAsc); }
                else { setZipSortCol(col); setZipSortAsc(col === 'zip'); }
            };
            const zipSortArrow = (col) => zipSortCol === col ? (zipSortAsc ? ' \u25B2' : ' \u25BC') : '';

            const supplyByZip = useMemo(() => {
                const licensed = data.filter(f => f.facility_status === 'LICENSED');
                const result = {};
                ZIP_DEMAND_DATA.forEach(z => {
                    const inZip = licensed.filter(f => String(f.facility_zip) === z.zip);
                    // Count facilities per district within this ZIP
                    const distCounts = {};
                    inZip.forEach(f => {
                        if (f.supervisor_district) {
                            distCounts[f.supervisor_district] = (distCounts[f.supervisor_district] || 0) + 1;
                        }
                    });
                    // Sort districts by facility count descending
                    const distsSorted = Object.entries(distCounts).sort((a, b) => b[1] - a[1]).map(e => e[0]);
                    result[z.zip] = {
                        totalCap: inZip.reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        elfaCap: inZip.filter(f => f.elfa_contracted === 'Yes').reduce((s, f) => s + (f.facility_capacity || 0), 0),
                        count: inZip.length,
                        districts: distsSorted
                    };
                });
                return result;
            }, [data]);

            // ===== Selected ZIP derived data =====
            const selectedZipDemand = useMemo(() => ZIP_DEMAND_DATA.find(z => z.zip === selectedZip) || ZIP_DEMAND_DATA[0], [selectedZip]);
            const selectedZipSupply = useMemo(() => supplyByZip[selectedZip] || {totalCap:0,elfaCap:0,count:0,districts:[]}, [selectedZip, supplyByZip]);

            const zipDemandTotals = useMemo(() => {
                const t = { total_hh: 0, le110: 0, b110_150: 0, b150_200: 0, gt200: 0, under3: 0, age3_4: 0, age5: 0 };
                ZIP_DEMAND_DATA.forEach(d => { Object.keys(t).forEach(k => { t[k] += d[k]; }); });
                t.under6 = t.under3 + t.age3_4 + t.age5;
                return t;
            }, []);

            const zipTableData = useMemo(() => {
                const rows = ZIP_DEMAND_DATA.map(z => {
                    const supply = supplyByZip[z.zip] || { totalCap: 0, elfaCap: 0, count: 0, districts: [] };
                    const under6 = z.under3 + z.age3_4 + z.age5;
                    const dists = supply.districts || [];
                    return {
                        zip: z.zip,
                        districts: dists.join(', ') || '-',
                        primaryDistrict: dists.length > 0 ? parseInt(dists[0]) : 99,
                        facilities: supply.count,
                        totalCap: supply.totalCap,
                        elfaCap: supply.elfaCap,
                        elfaPct: supply.totalCap > 0 ? Math.round(supply.elfaCap / supply.totalCap * 100) : 0,
                        under6,
                        le110: z.le110,
                        le200: z.le110 + z.b110_150 + z.b150_200,
                        slotsPerChild: under6 > 0 ? parseFloat((supply.totalCap / under6).toFixed(2)) : 0,
                        elfaSlotsPerChild: under6 > 0 ? parseFloat((supply.elfaCap / under6).toFixed(2)) : 0
                    };
                });
                const dir = zipSortAsc ? 1 : -1;
                rows.sort((a, b) => {
                    if (zipSortCol === 'districts') return dir * (a.primaryDistrict - b.primaryDistrict);
                    const av = a[zipSortCol], bv = b[zipSortCol];
                    if (typeof av === 'string') return dir * av.localeCompare(bv);
                    return dir * (av - bv);
                });
                return rows;
            }, [supplyByZip, zipSortCol, zipSortAsc]);

            const zipSupplyTotals = useMemo(() => {
                return {
                    totalCap: Object.values(supplyByZip).reduce((s, v) => s + v.totalCap, 0),
                    elfaCap: Object.values(supplyByZip).reduce((s, v) => s + v.elfaCap, 0),
                    count: Object.values(supplyByZip).reduce((s, v) => s + v.count, 0)
                };
            }, [supplyByZip]);

            // ===== Pressure Lens =====
            // Surfaces who bears the cost of expansion: where FCCs are concentrated, how much
            // ELFA-funded center capacity is pressing in alongside them, and what language
            // mix the registered providers report. Calls out the survivorship-bias gap when
            // a district has many CCLD providers but few self-registered voices.
            const pressureByDistrict = useMemo(() => {
                const snap = window.PROVIDER_SNAPSHOT?.providers || [];
                const result = {};
                for (let i = 1; i <= 11; i++) {
                    const s = supplyByDistrict[i] || {};
                    const fccCap = s.fccCap || 0;
                    const fccCount = s.fccCount || 0;
                    const totalCap = s.totalCap || 0;
                    const elfaCap = s.elfaCap || 0;
                    const nonFccElfaCap = Math.max(0, elfaCap - 0); // ELFA includes both FCC + center; treat all ELFA as expansion pressure on FCCs
                    // Route providers to district via neighborhood-first (handles Portola
                    // in 94134 going to D9 rather than D10).
                    const inDist = snap.filter(p => providerDistrict(p) === i);
                    const langCounts = { Spanish: 0, Cantonese: 0, Mandarin: 0, English: 0, Other: 0 };
                    inDist.forEach(p => {
                        const langs = p.languages || [];
                        if (langs.includes('Spanish')) langCounts.Spanish++;
                        if (langs.includes('Cantonese')) langCounts.Cantonese++;
                        if (langs.includes('Mandarin')) langCounts.Mandarin++;
                        if (langs.includes('English')) langCounts.English++;
                        if (langs.some(l => !['Spanish','Cantonese','Mandarin','English'].includes(l))) langCounts.Other++;
                    });
                    const registeredN = inDist.length;
                    // Population language baseline: apportion each ZIP's ACS counts to the
                    // districts it overlaps via ZIP_DISTRICT_WEIGHTS (handles 94134 splitting
                    // across D9 Portola / D10 Vis Valley / D11 Crocker Amazon).
                    const pop = { tot: 0, eng: 0, spa: 0, chi: 0, tag: 0, vie: 0 };
                    Object.entries(ACS_LANG_BY_ZIP).forEach(([zip, a]) => {
                        const w = zipDistrictWeights(zip)[i] || 0;
                        if (w === 0) return;
                        pop.tot += a.pop * w; pop.eng += a.eng * w; pop.spa += a.spa * w;
                        pop.chi += a.chi * w; pop.tag += a.tag * w; pop.vie += a.vie * w;
                    });
                    Object.keys(pop).forEach(k => pop[k] = Math.round(pop[k]));
                    const popShare = pop.tot > 0 ? {
                        eng: pop.eng / pop.tot, spa: pop.spa / pop.tot,
                        chi: pop.chi / pop.tot, tag: pop.tag / pop.tot, vie: pop.vie / pop.tot
                    } : { eng: 0, spa: 0, chi: 0, tag: 0, vie: 0 };
                    const popCounts = { eng: pop.eng, spa: pop.spa, chi: pop.chi, tag: pop.tag, vie: pop.vie };
                    // Registered: raw counts only. Don't normalize against the registry size
                    // (the registry itself is biased — % of biased sample is misleading).
                    const regCounts = {
                        spa: langCounts.Spanish,
                        chi: Math.max(langCounts.Cantonese, langCounts.Mandarin), // unique Chinese voices
                        eng: langCounts.English
                    };
                    // Coverage rate: voices per 10,000 residents who speak that language.
                    // Honest comparison across districts; doesn't conflate "% of registry".
                    const coverage = {
                        spa: pop.spa > 0 ? (regCounts.spa / pop.spa) * 10000 : 0,
                        chi: pop.chi > 0 ? (regCounts.chi / pop.chi) * 10000 : 0,
                        eng: pop.eng > 0 ? (regCounts.eng / pop.eng) * 10000 : 0
                    };
                    // Fcc concentration = % of district licensed capacity in FCC homes
                    const fccConcentration = totalCap > 0 ? fccCap / totalCap : 0;
                    // ELFA pressure = ELFA capacity per slot of FCC capacity. >1 = ELFA-funded
                    // capacity outweighs all FCC capacity in the district.
                    const elfaPressure = fccCap > 0 ? elfaCap / fccCap : 0;
                    // Voice gap = ratio of registered providers to CCLD FCC count.
                    // Low ratio = providers exist but aren't being heard from.
                    const voiceCoverage = fccCount > 0 ? registeredN / fccCount : 0;
                    // Squeeze score combines: high FCC presence + high ELFA pressure + low voice coverage
                    const squeezeScore =
                        (fccConcentration * 100) * 0.35 +
                        (Math.min(elfaPressure, 5) * 20) * 0.45 +
                        ((1 - Math.min(voiceCoverage, 1)) * 100) * 0.20;
                    result[i] = {
                        district: i,
                        fccCount, fccCap, totalCap, elfaCap,
                        fccConcentration, elfaPressure,
                        registeredN, voiceCoverage, langCounts,
                        popShare, popCounts, regCounts, coverage, popTotal: pop.tot,
                        squeezeScore
                    };
                }
                return result;
            }, [supplyByDistrict]);

            const pressureRows = useMemo(() => {
                return Object.values(pressureByDistrict).sort((a, b) => b.squeezeScore - a.squeezeScore);
            }, [pressureByDistrict]);

            // ===== Language-Segmented Market =====
            // Tests Oscar's hypothesis: if families pick programs by language match, the
            // supply-demand picture is segmented per language. A Chinese-speaking provider
            // competes for Chinese-speaking families (small saturated pool); a Spanish-
            // speaking family competes for very few Spanish-capable spots. Here we count
            // reported vacant slots (under-6: infant + toddler + preschool) per language
            // segment, and compare to the kids-under-6 estimate per language segment
            // (district under-6 demand × population language share).
            const marketByDistrict = useMemo(() => {
                const vacs = window.VACANCY_SNAPSHOT?.vacancies || [];
                const result = {};
                for (let i = 1; i <= 11; i++) {
                    const dist = pressureByDistrict[i] || {};
                    const u6 = (DEMAND_DATA.find(d => d.district === i) || {});
                    const under6 = (u6.under3 || 0) + (u6.age3_4 || 0) + (u6.age5 || 0);
                    // demand by language segment = under6 kids × population language share
                    const demandSpa = Math.round(under6 * (dist.popShare?.spa || 0));
                    const demandChi = Math.round(under6 * (dist.popShare?.chi || 0));
                    const demandEng = Math.round(under6 * (dist.popShare?.eng || 0));
                    // supply: filter vacancies to providers in this district by neighborhood,
                    // then by language capability. Each vacancy contributes its under-6 spots
                    // to every language it serves (it's the same opening, accessible to families
                    // who match any of those languages).
                    let supplySpa = 0, supplyChi = 0, supplyEng = 0, supplyTotal = 0, vacCount = 0;
                    vacs.forEach(v => {
                        const provDist = NEIGHBORHOOD_TO_DISTRICT[v.nh] || ZIP_TO_DISTRICT[v.z];
                        if (provDist !== i) return;
                        const u6Spots = (v.i || 0) + (v.t || 0) + (v.p || 0);
                        supplyTotal += u6Spots;
                        vacCount++;
                        const langs = v.l || [];
                        if (langs.includes('Spanish')) supplySpa += u6Spots;
                        if (langs.includes('Cantonese') || langs.includes('Mandarin')) supplyChi += u6Spots;
                        if (langs.includes('English')) supplyEng += u6Spots;
                    });
                    // Slots-per-100-kids = visible openings per 100 kids in segment
                    const rate = (supply, demand) => demand > 0 ? (supply / demand) * 100 : null;
                    result[i] = {
                        district: i, under6, vacCount, supplyTotal,
                        demandSpa, supplySpa, rateSpa: rate(supplySpa, demandSpa),
                        demandChi, supplyChi, rateChi: rate(supplyChi, demandChi),
                        demandEng, supplyEng, rateEng: rate(supplyEng, demandEng)
                    };
                }
                return result;
            }, [pressureByDistrict]);

            const marketRows = useMemo(() => Object.values(marketByDistrict), [marketByDistrict]);

            // ===== Forward Look: 750-slot ELFA Expansion (Summer 2026) =====
            // Source: sf.gov mayor announcement + provider.sfdec.org/join-elfa criteria
            // Application window: 2026-04-30 to 2026-06-30. Focus: infant + toddler (under 3).
            // Priority neighborhoods: Sunset/Parkside/Richmond/Mission/Bayview/Portola/Mission
            // Bay/Excelsior/Glen Park/SoMa → covers districts D1, D4, D6, D7, D8, D9, D10, D11.
            // Ranking points: 5 (infant/toddler), 1 (CalWORKs), 1 (marginalized), 1 (IFSP/IEP).
            // Tiebreaker: higher enrollment. NO language or geographic priority in the points.
            const ELFA_EXPANSION = {
                totalSlots: 750,
                ageGroup: 'Infant + Toddler (under 3)',
                rollout: 'Summer 2026',
                applicationWindow: 'Apr 30 – Jun 30, 2026',
                priorityDistricts: [1, 4, 6, 7, 8, 9, 10, 11],
                rankingNote: 'Points reward service type (infant/toddler) and existing enrollment. No language priority.'
            };

            // Roll up the language-segmented market to the existing corridor groupings
            // (Westside / North-Central / South-Central / Southeast). Same numbers as the
            // district table summed across constituent districts.
            const marketByCorridor = useMemo(() => {
                return Object.entries(CORRIDORS).map(([name, dists]) => {
                    const rows = dists.map(d => marketByDistrict[d] || {});
                    const sum = (k) => rows.reduce((s, r) => s + (r[k] || 0), 0);
                    const vacCount = sum('vacCount');
                    const under6 = sum('under6');
                    const demSpa = sum('demandSpa'), demChi = sum('demandChi'), demEng = sum('demandEng');
                    const supSpa = sum('supplySpa'), supChi = sum('supplyChi'), supEng = sum('supplyEng');
                    // Voice coverage at corridor level: sum registered providers vs sum CCLD FCC count
                    const regN = dists.reduce((s, d) => s + ((pressureByDistrict[d] || {}).registeredN || 0), 0);
                    const fccN = dists.reduce((s, d) => s + ((pressureByDistrict[d] || {}).fccCount || 0), 0);
                    return {
                        name, dists, vacCount, under6,
                        demSpa, supSpa, rateSpa: demSpa > 0 ? (supSpa / demSpa) * 100 : null,
                        demChi, supChi, rateChi: demChi > 0 ? (supChi / demChi) * 100 : null,
                        demEng, supEng, rateEng: demEng > 0 ? (supEng / demEng) * 100 : null,
                        regN, fccN, voiceCoverage: fccN > 0 ? regN / fccN : 0
                    };
                });
            }, [marketByDistrict, pressureByDistrict]);

            const expansionImpact = useMemo(() => {
                const TOTAL = ELFA_EXPANSION.totalSlots;
                const priority = ELFA_EXPANSION.priorityDistricts;
                const dists = priority.map(i => ({ d: i, m: marketByDistrict[i] || {}, p: pressureByDistrict[i] || {} }));

                // Citywide registry language share (fallback for districts with too few voices)
                const snap = window.PROVIDER_SNAPSHOT?.providers || [];
                const cwLang = { Spanish: 0, Cantonese: 0, Mandarin: 0, English: 0 };
                snap.forEach(p => (p.languages || []).forEach(l => { if (cwLang[l] !== undefined) cwLang[l]++; }));
                const cwShare = {
                    spa: snap.length > 0 ? cwLang.Spanish / snap.length : 0,
                    chi: snap.length > 0 ? Math.max(cwLang.Cantonese, cwLang.Mandarin) / snap.length : 0,
                    eng: snap.length > 0 ? cwLang.English / snap.length : 0
                };

                // ----- SCENARIO A: status-quo allocation -----
                // Distribute 750 slots proportional to existing ELFA capacity in priority
                // districts (the ranking system rewards high enrollment + experience, both
                // of which favor existing well-resourced ELFA providers). New slots inherit
                // the language profile of the registered providers in that district. Where
                // registered N is too small (< 3) we fall back to the citywide registry mix.
                const totalElfaCap = dists.reduce((s, x) => s + (x.p.elfaCap || 0), 0) || 1;
                const allocA = dists.map(x => {
                    const slots = Math.round(TOTAL * (x.p.elfaCap || 0) / totalElfaCap);
                    const regN = x.p.registeredN || 0;
                    const useCw = regN < 3;
                    const distShare = useCw ? cwShare : {
                        spa: regN > 0 ? (x.p.regCounts?.spa || 0) / regN : cwShare.spa,
                        chi: regN > 0 ? (x.p.regCounts?.chi || 0) / regN : cwShare.chi,
                        eng: regN > 0 ? (x.p.regCounts?.eng || 0) / regN : cwShare.eng
                    };
                    return { d: x.d, slots, spaSlots: slots * distShare.spa, chiSlots: slots * distShare.chi, engSlots: slots * distShare.eng };
                });

                // ----- SCENARIO B: demand-proportional allocation -----
                // Distribute 750 slots proportional to district under-3 demand. New slots
                // inherit the population language share at home (an "unbiased" baseline).
                const under3 = (i) => (DEMAND_DATA.find(d => d.district === i) || {}).under3 || 0;
                const totalU3 = dists.reduce((s, x) => s + under3(x.d), 0) || 1;
                const allocB = dists.map(x => {
                    const slots = Math.round(TOTAL * under3(x.d) / totalU3);
                    const ps = x.p.popShare || { spa: 0, chi: 0, eng: 0 };
                    return { d: x.d, slots, spaSlots: slots * ps.spa, chiSlots: slots * ps.chi, engSlots: slots * ps.eng };
                });

                // ----- SCENARIO C: equity-corrected allocation -----
                // Distribute 750 slots to fill the Spanish-segment shortfall in priority
                // districts. All slots Spanish-capable (also English-bilingual since the
                // registered Spanish providers all list English too).
                const totalSpaDemand = dists.reduce((s, x) => s + (x.m.demandSpa || 0), 0) || 1;
                const allocC = dists.map(x => {
                    const slots = Math.round(TOTAL * (x.m.demandSpa || 0) / totalSpaDemand);
                    return { d: x.d, slots, spaSlots: slots, chiSlots: 0, engSlots: slots };
                });

                // Aggregate per-district contributions to citywide-priority totals
                const sumLang = (alloc, lang) => alloc.reduce((s, a) => s + a[lang + 'Slots'], 0);
                const totalDemSpa = dists.reduce((s, x) => s + (x.m.demandSpa || 0), 0);
                const totalDemChi = dists.reduce((s, x) => s + (x.m.demandChi || 0), 0);
                const totalDemEng = dists.reduce((s, x) => s + (x.m.demandEng || 0), 0);
                const curSupSpa = dists.reduce((s, x) => s + (x.m.supplySpa || 0), 0);
                const curSupChi = dists.reduce((s, x) => s + (x.m.supplyChi || 0), 0);
                const curSupEng = dists.reduce((s, x) => s + (x.m.supplyEng || 0), 0);

                const buildRow = (label, addSpa, addChi, addEng) => ({
                    label,
                    addSpa: Math.round(addSpa), addChi: Math.round(addChi), addEng: Math.round(addEng),
                    spaSup: Math.round(curSupSpa + addSpa), chiSup: Math.round(curSupChi + addChi), engSup: Math.round(curSupEng + addEng),
                    spaRate: totalDemSpa > 0 ? ((curSupSpa + addSpa) / totalDemSpa) * 100 : 0,
                    chiRate: totalDemChi > 0 ? ((curSupChi + addChi) / totalDemChi) * 100 : 0,
                    engRate: totalDemEng > 0 ? ((curSupEng + addEng) / totalDemEng) * 100 : 0
                });

                return {
                    today: buildRow('Today (no expansion)', 0, 0, 0),
                    scenarioA: buildRow('A. Status-quo (likely)', sumLang(allocA, 'spa'), sumLang(allocA, 'chi'), sumLang(allocA, 'eng')),
                    scenarioB: buildRow('B. Demand-proportional', sumLang(allocB, 'spa'), sumLang(allocB, 'chi'), sumLang(allocB, 'eng')),
                    scenarioC: buildRow('C. Equity-corrected (Spanish-target)', sumLang(allocC, 'spa'), sumLang(allocC, 'chi'), sumLang(allocC, 'eng')),
                    allocA, allocB, allocC,
                    totalDemSpa: Math.round(totalDemSpa), totalDemChi: Math.round(totalDemChi), totalDemEng: Math.round(totalDemEng)
                };
            }, [marketByDistrict, pressureByDistrict]);

            // Roll up Scenario A allocation by corridor to show where the 750 slots will
            // concentrate geographically and by language.
            const expansionByCorridor = useMemo(() => {
                const sumIn = (alloc, dists, key) => alloc.filter(a => dists.includes(a.d)).reduce((s, a) => s + (a[key] || 0), 0);
                return Object.entries(CORRIDORS).map(([name, dists]) => {
                    const m = marketByCorridor.find(c => c.name === name) || {};
                    const aTot = sumIn(expansionImpact.allocA, dists, 'slots');
                    const aSpa = sumIn(expansionImpact.allocA, dists, 'spaSlots');
                    const aChi = sumIn(expansionImpact.allocA, dists, 'chiSlots');
                    const bTot = sumIn(expansionImpact.allocB, dists, 'slots');
                    const bSpa = sumIn(expansionImpact.allocB, dists, 'spaSlots');
                    const bChi = sumIn(expansionImpact.allocB, dists, 'chiSlots');
                    const cTot = sumIn(expansionImpact.allocC, dists, 'slots');
                    const cSpa = sumIn(expansionImpact.allocC, dists, 'spaSlots');
                    const newSpaA = (m.supSpa || 0) + aSpa;
                    const newChiA = (m.supChi || 0) + aChi;
                    const newSpaB = (m.supSpa || 0) + bSpa;
                    return {
                        name, dists,
                        demSpa: m.demSpa || 0, demChi: m.demChi || 0,
                        curSupSpa: m.supSpa || 0, curSupChi: m.supChi || 0,
                        curRateSpa: m.rateSpa, curRateChi: m.rateChi,
                        aTot: Math.round(aTot), aSpa: Math.round(aSpa), aChi: Math.round(aChi),
                        bTot: Math.round(bTot), bSpa: Math.round(bSpa), bChi: Math.round(bChi),
                        cTot: Math.round(cTot), cSpa: Math.round(cSpa),
                        rateA_Spa: m.demSpa > 0 ? (newSpaA / m.demSpa) * 100 : null,
                        rateA_Chi: m.demChi > 0 ? (newChiA / m.demChi) * 100 : null,
                        rateB_Spa: m.demSpa > 0 ? (newSpaB / m.demSpa) * 100 : null
                    };
                });
            }, [expansionImpact, marketByCorridor]);

            const voiceGapTotals = useMemo(() => {
                const snap = window.PROVIDER_SNAPSHOT?.providers || [];
                const totalFcc = supplyByDistrict.total?.fccCount || 0;
                const langs = { Spanish: 0, Cantonese: 0, Mandarin: 0, English: 0 };
                snap.forEach(p => {
                    (p.languages || []).forEach(l => { if (langs[l] !== undefined) langs[l]++; });
                });
                // Citywide population totals (sum all SF ZIPs in the ACS snapshot)
                const popTotals = { tot: 0, eng: 0, spa: 0, chi: 0 };
                Object.values(ACS_LANG_BY_ZIP).forEach(a => {
                    popTotals.tot += a.pop; popTotals.eng += a.eng; popTotals.spa += a.spa; popTotals.chi += a.chi;
                });
                const chineseVoices = Math.max(langs.Cantonese, langs.Mandarin); // unique Chinese-speaking
                return {
                    totalCcldFcc: totalFcc,
                    registeredN: snap.length,
                    voiceCoverage: totalFcc > 0 ? snap.length / totalFcc : 0,
                    voices: { Spanish: langs.Spanish, Cantonese: langs.Cantonese, Mandarin: langs.Mandarin, English: langs.English, Chinese: chineseVoices },
                    pop: popTotals,
                    coverage: {
                        spa: popTotals.spa > 0 ? (langs.Spanish / popTotals.spa) * 10000 : 0,
                        chi: popTotals.chi > 0 ? (chineseVoices / popTotals.chi) * 10000 : 0,
                        eng: popTotals.eng > 0 ? (langs.English / popTotals.eng) * 10000 : 0
                    }
                };
            }, [supplyByDistrict]);

            const zipChartRef = useRef(null);
            const zipChartInst = useRef(null);

            const citywideChartRef = useRef(null);
            const citywideChartInst = useRef(null);

            const overviewChartRef = useRef(null);
            const overviewChartInst = useRef(null);
            const corridorChartRef = useRef(null);
            const corridorChartInst = useRef(null);

            const totalPages = Math.ceil(filtered.length / perPage);
            const paged = useMemo(() => {
                const start = (page - 1) * perPage;
                return filtered.slice(start, start + perPage);
            }, [filtered, page]);

            useEffect(() => { setPage(1); }, [filtered.length]);

            useEffect(() => {
                if (tab !== 'programs') return;
                if (!data.length) return;
                if (!mapRef.current) return;
                if (mapInst.current) return;
                try {
                    const sfBounds = L.latLngBounds(
                        L.latLng(37.70, -122.52),
                        L.latLng(37.83, -122.35)
                    );
                    const m = L.map(mapRef.current, {
                        maxBounds: sfBounds,
                        maxBoundsViscosity: 0.75,
                        minZoom: 11,
                        maxZoom: 18
                    }).setView([37.7749, -122.4194], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(m);
                    const legend = L.control({position: 'bottomright'});
                    legend.onAdd = function() {
                        const div = L.DomUtil.create('div', 'map-legend');
                        div.innerHTML = `
                            <h4>Status</h4>
                            <div class="legend-item"><div class="legend-color" style="background:#4CAF50;"></div><span>Licensed</span></div>
                            <div class="legend-item"><div class="legend-color" style="background:#f44336;"></div><span>Closed</span></div>
                            <div class="legend-item"><div class="legend-color" style="background:#ff9800;"></div><span>Inactive</span></div>
                            <div class="legend-item"><div class="legend-color" style="background:#2196F3;"></div><span>Other</span></div>
                            <h4 style="margin-top:8px;">Location</h4>
                            <div class="legend-item"><div class="legend-color" style="background:#4CAF50; border-color:white;"></div><span>Geocoded</span></div>
                            <div class="legend-item"><div class="legend-color bordered" style="background:#4CAF50;"></div><span>ZIP-based</span></div>
                        `;
                        return div;
                    };
                    legend.addTo(m);
                    mapInst.current = m;
                    heatLayer.current = L.layerGroup().addTo(m);
                    markerLayer.current = L.layerGroup().addTo(m);
                    m.on('moveend zoomend', () => {
                        if (mapBoundsFilter) {
                            setCurrentBounds(m.getBounds());
                        }
                    });
                } catch (e) {
                    console.error('Map initialization failed:', e);
                }
            }, [data.length, mapBoundsFilter, tab]);

            useEffect(() => {
                if (tab !== 'programs' || !mapInst.current) return;
                heatLayer.current.clearLayers();
                markerLayer.current.clearLayers();
                const valid = filtered.filter(f => f.latitude && f.longitude);
                if (heatmap && valid.length) {
                    const heat = valid.map(f => [f.latitude, f.longitude, (f.facility_capacity || 10) / 100]);
                    L.heatLayer(heat, {radius: 25, blur: 15, maxZoom: 17}).addTo(heatLayer.current);
                }
                if (markers) {
                    valid.forEach(f => {
                        const color = f.facility_status === 'LICENSED' ? '#4CAF50' :
                                     f.facility_status === 'CLOSED' ? '#f44336' :
                                     f.facility_status === 'INACTIVE' ? '#ff9800' : '#2196F3';
                        const isJittered = f.tags?.address_source === 'zip_code_approximate';
                        const m = L.circleMarker([f.latitude, f.longitude], {
                            radius: Math.sqrt(f.facility_capacity || 10) * 1.5,
                            fillColor: color,
                            color: isJittered ? '#FFA500' : 'white',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: isJittered ? 0.5 : 0.7
                        });
                        const addressText = f.facility_address || `ZIP ${f.facility_zip} (approximate)`;
                        const districtText = f.supervisor_district ? `<br>District ${f.supervisor_district} - ${f.supervisor_name}` : '';
                        const neighborhoodText = f.neighborhood ? `<br>Neighborhood: ${f.neighborhood}` : '';
                        m.bindPopup(`<strong>${f.facility_name}</strong><br>License #: ${f.facility_number}<br>Type: ${f.facility_type}<br>${addressText}${districtText}${neighborhoodText}<br>Capacity: ${f.facility_capacity}<br>Status: ${f.facility_status}${f.sfusd_site === 'Yes' ? '<br><strong style="color:#673AB7">SFUSD: ' + f.sfusd_school_name + '</strong>' : ''}${isJittered ? '<br><em style="color:#FF8C00">Location approximate</em>' : ''}`);
                        m.addTo(markerLayer.current);
                    });
                }
            }, [filtered, heatmap, markers, tab]);

            useEffect(() => {
                if (tab !== 'programs') return;
                if (!chartRef.current) return;
                if (chartInst.current) chartInst.current.destroy();
                const ranges = ['0-20', '21-50', '51-100', '101-200', '200+'];
                const counts = ranges.map((r, i) => {
                    const [min, max] = r.split('-').map(n => n === '200+' ? Infinity : parseInt(n));
                    return filtered.filter(f => {
                        const c = f.facility_capacity || 0;
                        return max === Infinity ? c > min : c >= min && c <= max;
                    }).length;
                });
                chartInst.current = new Chart(chartRef.current, {
                    type: 'bar',
                    data: {
                        labels: ranges,
                        datasets: [{label: 'Facilities', data: counts, backgroundColor: 'rgba(102,126,234,0.8)'}]
                    },
                    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true}}}
                });
            }, [filtered, tab]);

            // ===== Landscape grouped bar chart (district view) =====
            useEffect(() => {
                if (tab !== 'landscape' || geoView !== 'district') return;
                if (!landscapeChartRef.current || !data.length) return;
                if (landscapeChartInst.current) landscapeChartInst.current.destroy();

                const labels = DEMAND_DATA.map(d => {
                    if (!saturationOn) return 'D' + d.district;
                    const u6 = d.under3 + d.age3_4 + d.age5;
                    const slots = saturationMode === 'elfa' ? (supplyByDistrict[d.district]?.elfaCap || 0) : (supplyByDistrict[d.district]?.totalCap || 0);
                    const sat = getSaturation(slots, u6);
                    return sat.emoji + ' D' + d.district;
                });
                const elfaCapData = DEMAND_DATA.map(d => supplyByDistrict[d.district]?.elfaCap || 0);
                const nonElfaCapData = DEMAND_DATA.map(d => {
                    const s = supplyByDistrict[d.district] || {};
                    return (s.totalCap || 0) - (s.elfaCap || 0);
                });

                const hiElfa = DEMAND_DATA.map(d => d.district === selectedDistrict ? '#7b2d8e' : 'rgba(123,45,142,0.25)');
                const hiBlue = DEMAND_DATA.map(d => d.district === selectedDistrict ? 'rgba(66,133,244,0.7)' : 'rgba(66,133,244,0.2)');
                const hiGreen1 = DEMAND_DATA.map(d => d.district === selectedDistrict ? '#1B6B4A' : 'rgba(27,107,74,0.25)');
                const hiGreen2 = DEMAND_DATA.map(d => d.district === selectedDistrict ? '#2D8F64' : 'rgba(45,143,100,0.25)');
                const hiOrange = DEMAND_DATA.map(d => d.district === selectedDistrict ? '#E07B3C' : 'rgba(224,123,60,0.25)');

                landscapeChartInst.current = new Chart(landscapeChartRef.current, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'ELFA Contracted (subset of CA licensed)',
                                data: elfaCapData,
                                backgroundColor: hiElfa,
                                borderColor: '#6a2579',
                                borderWidth: 1,
                                stack: 'capacity'
                            },
                            {
                                label: 'CA Licensed (non-ELFA)',
                                data: nonElfaCapData,

                                <p><strong>Household variable:</strong> Households with children under 6 are derived from S1101_C01_005E (HH with children under 18) multiplied by the under-6 sub-category percentages (S1101_C01_006E + S1101_C01_007E). AMI band distributions are modeled estimates, not direct survey responses.</p>
